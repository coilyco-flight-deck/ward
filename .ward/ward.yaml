# Catalog schema: coilyco-flight-deck/agentic-os.
# The security: block below is required per the retired ward doctor surface
# inventory; ward dogfoods it. Field reference: docs/ward-yaml.md.
catalog:
  description: "ward - a contributor-facing cli-guard consumer. Carries project dev verbs; it is also absorbing the operator surface from the retiring coily (spec REST rides ward-kdl)."
  dependsOn:
    - forgejo.coilysiren.me/coilyco-flight-deck/cli-guard

commands:
  build:
    run: make build
    description: Build all packages.
  test:
    run: make test
    description: Run the unit test suite.
  pre-commit:
    run: pre-commit run --all-files
    description: Run the repository pre-commit suite across every tracked file.
  format:
    run: go fmt ./...
    description: Format every Go package.
  install:
    run: make install
    description: Install the ward binary into GOBIN (the Go-CLI install verb).
  vet:
    run: make vet
    description: go vet across the tree.
  lint:
    run: make lint
    description: Lint with golangci-lint.
  agent-flags:
    run: make agent-flags
    description: Regenerate the code-derived ward agent flag tree.
  sync-fleet-assets:
    run: make sync-fleet-assets
    description: Mirror the canonical fleet KDL into the embedded generated asset.
  tidy:
    run: make tidy
    description: go mod tidy.
  cover:
    run: make cover
    description: Unit tests with a coverage profile.
  demo-image:
    run: make demo-image
    description: Build the public demo image that mounts a workspace plus substrate combo for a neutral OSS repo.
  lint-refs:
    run: make lint-refs
    description: "Lint issue refs in public docs (ward#446): every ref must resolve for a GitHub reader. `make lint-refs ARGS=--fix` rewrites."
  lint-workflows:
    run: make lint-workflows
    description: "Lint the Forgejo<->GitHub Actions mirror (ward#214): the test pair stays identical except runs-on. `make lint-workflows ARGS=--fix` regenerates the Forgejo mirror."
  build-ward-kdl:
    run: make build-ward-kdl
    description: build or rebuild the generated ward binary from the ward-kdl source group, one shot for ease of use in development.

security:
  protected_binaries:
    - name: docker
      mode: deny-direct
      allowed_wrappers:
        - ward-kdl docker
    - name: kubectl
      mode: deny-direct
      allowed_wrappers:
        - ward-kdl kubectl
  hooks:
    deny_bare_binaries:
      - docker
      - kubectl
    route_hints:
      docker: "route docker through `ward-kdl docker`, not the bare binary"
      kubectl: "route kubectl through `ward-kdl kubectl`, not the bare binary"
