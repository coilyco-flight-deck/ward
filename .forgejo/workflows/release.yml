# Forgejo-canonical release pipeline. promote.yml gates every main push, builds
# draft assets, and fast-forwards the `release` branch only after that publish
# succeeds. This workflow promotes the exact released SHA without rebuilding it:
# tag, retag the draft assets, publish, and update install channels in a queued
# order. A workflow_dispatch re-fires it against the `release` ref on a missed
# enqueue. See docs/release.md. Tag selection and release creation now use
# repo-local helpers so a shared-action fetch timeout cannot block setup.

name: release

on:
  push:
    branches: [release]
  workflow_dispatch:

concurrency:
  group: release-pipeline
  cancel-in-progress: false

permissions:
  contents: write
  packages: read

jobs:
  release:
    runs-on: docker
    container:
      image: forgejo.coilysiren.me/coilyco-flight-deck/agentic-os:release
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.tag.outputs.new_tag }}
      version: ${{ steps.tag.outputs.new_version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: tag
        env:
          TAG_PUSH_TOKEN: ${{ github.token }}
        run: bash scripts/release-tag.sh

      - name: Verify the ward agent image alias resolves
        env:
          IMAGE: forgejo.coilysiren.me/coilyco-flight-deck/ward:release
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash scripts/registry-manifest-exists.sh

      - id: notes
        if: ${{ steps.tag.outputs.new_tag != '' }}
        shell: bash
        env:
          PREV_TAG: ${{ steps.tag.outputs.previous_tag }}
          NEW_TAG: ${{ steps.tag.outputs.new_tag }}
          COMPARE_URL: https://forgejo.coilysiren.me/coilyco-flight-deck/ward
          FALLBACK: ${{ steps.tag.outputs.changelog }}
        run: |
          set -euo pipefail
          # Reshape the tag helper's raw `git log` changelog into user-facing,
          # categorised notes (ward#486, docs/release-notes.md). Same range
          # the tag helper uses (previous_tag..HEAD, HEAD == the released SHA); a
          # missing previous_tag (first release) degrades to HEAD. On any
          # failure fall back to the raw changelog, never an empty body.
          if [ -n "$PREV_TAG" ]; then range="${PREV_TAG}..HEAD"; else range="HEAD"; fi
          # Commits whose full message (body included) carries a BREAKING note;
          # the script only sees subjects, so body-footer breaks are found here.
          breaking=$(git log --pretty=format:'%h' --grep='BREAKING' "$range" | tr '\n' ' ')
          if body=$(git log --pretty=format:'%h%x09%s' "$range" \
              | bash scripts/release-notes.sh \
                  --prev "$PREV_TAG" --new "$NEW_TAG" --compare-url "$COMPARE_URL" \
                  --breaking-hashes "$breaking") \
              && [ -n "$body" ]; then
            :
          else
            echo "::warning::release-notes.sh produced no body; falling back to the raw changelog" >&2
            body="$FALLBACK"
          fi
          {
            echo "body<<WARD_RELEASE_NOTES_EOF"
            echo "$body"
            echo "WARD_RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create the draft Forgejo release
        if: ${{ steps.tag.outputs.new_tag != '' }}
        env:
          DRAFT_TAG: ${{ steps.tag.outputs.new_tag }}
          FORGEJO_API: https://forgejo.coilysiren.me/api/v1/repos/coilyco-flight-deck/ward
          TOKEN: ${{ github.token }}
          RELEASE_NAME: ${{ steps.tag.outputs.new_tag }}
          RELEASE_BODY: ${{ steps.notes.outputs.body }}
          DIST_DIR: ${{ runner.temp }}/ward-release-empty
        run: mkdir -p "$DIST_DIR" && bash scripts/publish-draft-release.sh

      - name: Alert Telegram on main failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_RED_CHAT_ID }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          JOB: ${{ github.job }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          API_BASE: https://api.telegram.org
        run: "python3 -c 'exec(\"import os\\nimport sys\\nimport urllib.error\\nimport urllib.parse\\nimport urllib.request\\n\\ndef build_message():\\n    return \\\"\\\\n\\\".join([\\n        \\\"CI failed on main\\\",\\n        f\\\"repo: {os.environ['\"'\"'REPO'\"'\"']}\\\",\\n        f\\\"workflow: {os.environ['\"'\"'WORKFLOW'\"'\"']}\\\",\\n        f\\\"job: {os.environ['\"'\"'JOB'\"'\"']}\\\",\\n        f\\\"ref: {os.environ['\"'\"'REF'\"'\"']}\\\",\\n        f\\\"sha: {os.environ['\"'\"'SHA'\"'\"']}\\\",\\n        f\\\"run: {os.environ['\"'\"'RUN_URL'\"'\"']}\\\",\\n    ])\\n\\ndef main():\\n    bot_token = os.environ.get(\\\"BOT_TOKEN\\\", \\\"\\\")\\n    chat_id = os.environ.get(\\\"CHAT_ID\\\", \\\"\\\")\\n    if not bot_token or not chat_id:\\n        print(\\\"telegram alert missing required secret\\\", file=sys.stderr)\\n        return 2\\n    proxy_url = os.environ.get(\\\"FORGEJO_EGRESS_PROXY\\\", \\\"\\\").strip()\\n    payload = urllib.parse.urlencode(\\n        {\\n            \\\"chat_id\\\": chat_id,\\n            \\\"text\\\": build_message(),\\n            \\\"disable_web_page_preview\\\": \\\"true\\\",\\n        }\\n    ).encode(\\\"utf-8\\\")\\n    api_base = os.environ.get(\\\"API_BASE\\\", \\\"https://api.telegram.org\\\").rstrip(\\\"/\\\")\\n    request = urllib.request.Request(\\n        f\\\"{api_base}/bot{bot_token}/sendMessage\\\",\\n        data=payload,\\n        method=\\\"POST\\\",\\n    )\\n    opener = urllib.request.build_opener(\\n        urllib.request.ProxyHandler({\\\"https\\\": proxy_url})\\n        if proxy_url\\n        else urllib.request.ProxyHandler()\\n    )\\n    try:\\n        with opener.open(request, timeout=15) as response:\\n            response.read()\\n    except urllib.error.URLError as exc:\\n        print(f\\\"telegram alert failed ({type(exc).__name__})\\\", file=sys.stderr)\\n        return 1\\n    return 0\\n\\nraise SystemExit(main())\\n\")'"
  promote-draft-assets:
    needs: release
    if: ${{ needs.release.outputs.tag != '' }}
    runs-on: docker
    container:
      image: forgejo.coilysiren.me/coilyco-flight-deck/agentic-os:release
    env:
      TAG: ${{ needs.release.outputs.tag }}
      DRAFT_TAG: draft-${{ github.sha }}
      FORGEJO_API: https://forgejo.coilysiren.me/api/v1/repos/coilyco-flight-deck/ward
      GITHUB_REPO: coilyco-flight-deck/ward
    steps:
      - name: Fetch the draft assets staged on main
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash scripts/promote-draft-assets.sh
          ls -l dist

      - name: Upload assets to the Forgejo release
        env:
          TOKEN: ${{ secrets.CI_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ]; then
            echo "::error::CI_RELEASE_TOKEN not set; cannot upload release assets" >&2
            exit 1
          fi
          rel_id=$(curl -fsSL -H "Authorization: token ${TOKEN}" \
            "${FORGEJO_API}/releases/tags/${TAG}" \
            | grep -oE '"id"[[:space:]]*:[[:space:]]*[0-9]+' | head -1 | grep -oE '[0-9]+')
          if [ -z "${rel_id:-}" ]; then
            echo "::error::no release found for tag ${TAG}" >&2
            exit 1
          fi
          # Delete a same-named asset before re-uploading so a workflow re-run for
          # an existing tag replaces the file instead of erroring on a duplicate.
          existing=$(curl -fsSL -H "Authorization: token ${TOKEN}" \
            "${FORGEJO_API}/releases/${rel_id}/assets" || echo '[]')
          for name in $(cd dist && ls); do
            old=$(printf '%s' "$existing" | ASSET="$name" node -e '
              const a = JSON.parse(require("fs").readFileSync(0, "utf8") || "[]");
              const m = (a || []).find(x => x.name === process.env.ASSET);
              if (m) process.stdout.write(String(m.id));
            ')
            if [ -n "$old" ]; then
              curl -fsSL -X DELETE -H "Authorization: token ${TOKEN}" \
                "${FORGEJO_API}/releases/${rel_id}/assets/${old}" || true
            fi
            curl -fsSL -X POST -H "Authorization: token ${TOKEN}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"dist/${name}" \
              "${FORGEJO_API}/releases/${rel_id}/assets?name=${name}"
            echo "uploaded ${name} to Forgejo"
          done

      - name: Verify stable release assets before publication
        env:
          TOKEN: ${{ secrets.CI_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          bash scripts/verify-release-assets.sh

      - name: Publish the Forgejo release after assets land
        env:
          TOKEN: ${{ secrets.CI_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          rel_id=$(curl -fsSL -H "Authorization: token ${TOKEN}" \
            "${FORGEJO_API}/releases/tags/${TAG}" \
            | grep -oE '"id"[[:space:]]*:[[:space:]]*[0-9]+' | head -1 | grep -oE '[0-9]+')
          if [ -z "${rel_id:-}" ]; then
            echo "::error::no release found for tag ${TAG}" >&2
            exit 1
          fi
          curl -fsSL -X PATCH -H "Authorization: token ${TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"draft":false}' \
            "${FORGEJO_API}/releases/${rel_id}"
          echo "published Forgejo release ${TAG} after assets landed"

      - name: Publish the same assets to the GitHub mirror release
        env:
          PAT: ${{ secrets.GITHUB_MIRROR_PAT }}
        run: |
          set -euo pipefail
          # GitHub-mirror side: no PAT -> skip loudly, never fail the Forgejo
          # release. When the secret IS set (the ward#454 precondition Kai
          # provisions before dispatch) this publishes the byte-identical
          # binaries + SHA256SUMS to the GitHub release for the SAME tag, so a
          # GitHub arrival installs a checksummed binary without touching
          # forgejo.coilysiren.me (ward#454 done-condition). The release is
          # authored by the PAT user, not github-actions[bot].
          if [ -z "${PAT:-}" ]; then
            echo "::warning::GITHUB_MIRROR_PAT not set; skipping GitHub release publish (Forgejo release is unaffected)" >&2
            exit 0
          fi
          gh_api="https://api.github.com/repos/${GITHUB_REPO}"
          gh_uploads="https://uploads.github.com/repos/${GITHUB_REPO}"
          auth="Authorization: token ${PAT}"
          accept="Accept: application/vnd.github+json"

          # 1. Ensure the tag object exists on GitHub before the release points
          #    at it. The tag is immutable, so a concurrent push of the same
          #    object is a harmless no-op.
          git remote add github "https://x-access-token:${PAT}@github.com/${GITHUB_REPO}.git"
          git push github "refs/tags/${TAG}:refs/tags/${TAG}"

          # 2. Reuse the EXACT Forgejo release body so both pages read identically.
          #    node parses the JSON (the docker runner has no jq, but the checkout
          #    JS action leaves node on PATH).
          fj_rel=$(curl -fsSL "${FORGEJO_API}/releases/tags/${TAG}")
          BODY=$(printf '%s' "$fj_rel" | node -e '
            const r = JSON.parse(require("fs").readFileSync(0, "utf8"));
            process.stdout.write(r.body || "");
          ')

          # 3. Create the GitHub release, or find it if a prior run already did.
          payload=$(TAG="$TAG" BODY="$BODY" node -e '
            process.stdout.write(JSON.stringify({
              tag_name: process.env.TAG,
              name: process.env.TAG,
              body: process.env.BODY,
            }));
          ')
          code=$(curl -sS -o /tmp/gh_rel.json -w '%{http_code}' \
            -X POST -H "$auth" -H "$accept" "${gh_api}/releases" \
            --data-binary "$payload")
          if [ "$code" = "201" ]; then
            rel_id=$(node -e 'process.stdout.write(String(JSON.parse(require("fs").readFileSync("/tmp/gh_rel.json","utf8")).id))')
            echo "created GitHub release ${TAG} (id ${rel_id})"
          else
            echo "create returned HTTP ${code}; treating as existing release and looking it up" >&2
            rel_id=$(curl -fsSL -H "$auth" -H "$accept" "${gh_api}/releases/tags/${TAG}" \
              | node -e 'process.stdout.write(String(JSON.parse(require("fs").readFileSync(0,"utf8")).id || ""))')
            if [ -z "${rel_id:-}" ]; then
              echo "::error::could not create or find GitHub release for ${TAG} (create HTTP ${code})" >&2
              cat /tmp/gh_rel.json >&2 || true
              exit 1
            fi
            echo "using existing GitHub release ${TAG} (id ${rel_id})"
          fi

          # 4. Upload the identical assets. Delete a same-named asset first so a
          #    re-run replaces the file rather than 422-ing on a duplicate name.
          existing=$(curl -fsSL -H "$auth" -H "$accept" \
            "${gh_api}/releases/${rel_id}/assets?per_page=100" || echo '[]')
          for name in $(cd dist && ls); do
            old=$(printf '%s' "$existing" | ASSET="$name" node -e '
              const a = JSON.parse(require("fs").readFileSync(0, "utf8") || "[]");
              const m = (a || []).find(x => x.name === process.env.ASSET);
              if (m) process.stdout.write(String(m.id));
            ')
            if [ -n "$old" ]; then
              curl -fsSL -X DELETE -H "$auth" -H "$accept" \
                "${gh_api}/releases/assets/${old}" || true
            fi
            curl -fsSL -X POST -H "$auth" -H "Content-Type: application/octet-stream" \
              --data-binary @"dist/${name}" \
              "${gh_uploads}/releases/${rel_id}/assets?name=${name}"
            echo "uploaded ${name} to GitHub"
          done
          echo "GitHub release ${TAG} published with the full matrix + SHA256SUMS"

      - name: Alert Telegram on main failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_RED_CHAT_ID }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          JOB: ${{ github.job }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          API_BASE: https://api.telegram.org
        run: "python3 -c 'exec(\"import os\\nimport sys\\nimport urllib.error\\nimport urllib.parse\\nimport urllib.request\\n\\ndef build_message():\\n    return \\\"\\\\n\\\".join([\\n        \\\"CI failed on main\\\",\\n        f\\\"repo: {os.environ['\"'\"'REPO'\"'\"']}\\\",\\n        f\\\"workflow: {os.environ['\"'\"'WORKFLOW'\"'\"']}\\\",\\n        f\\\"job: {os.environ['\"'\"'JOB'\"'\"']}\\\",\\n        f\\\"ref: {os.environ['\"'\"'REF'\"'\"']}\\\",\\n        f\\\"sha: {os.environ['\"'\"'SHA'\"'\"']}\\\",\\n        f\\\"run: {os.environ['\"'\"'RUN_URL'\"'\"']}\\\",\\n    ])\\n\\ndef main():\\n    bot_token = os.environ.get(\\\"BOT_TOKEN\\\", \\\"\\\")\\n    chat_id = os.environ.get(\\\"CHAT_ID\\\", \\\"\\\")\\n    if not bot_token or not chat_id:\\n        print(\\\"telegram alert missing required secret\\\", file=sys.stderr)\\n        return 2\\n    proxy_url = os.environ.get(\\\"FORGEJO_EGRESS_PROXY\\\", \\\"\\\").strip()\\n    payload = urllib.parse.urlencode(\\n        {\\n            \\\"chat_id\\\": chat_id,\\n            \\\"text\\\": build_message(),\\n            \\\"disable_web_page_preview\\\": \\\"true\\\",\\n        }\\n    ).encode(\\\"utf-8\\\")\\n    api_base = os.environ.get(\\\"API_BASE\\\", \\\"https://api.telegram.org\\\").rstrip(\\\"/\\\")\\n    request = urllib.request.Request(\\n        f\\\"{api_base}/bot{bot_token}/sendMessage\\\",\\n        data=payload,\\n        method=\\\"POST\\\",\\n    )\\n    opener = urllib.request.build_opener(\\n        urllib.request.ProxyHandler({\\\"https\\\": proxy_url})\\n        if proxy_url\\n        else urllib.request.ProxyHandler()\\n    )\\n    try:\\n        with opener.open(request, timeout=15) as response:\\n            response.read()\\n    except urllib.error.URLError as exc:\\n        print(f\\\"telegram alert failed ({type(exc).__name__})\\\", file=sys.stderr)\\n        return 1\\n    return 0\\n\\nraise SystemExit(main())\\n\")'"
  bump-tap-formula:
    needs: [release, promote-draft-assets]
    if: ${{ needs.release.outputs.tag != '' }}
    runs-on: docker
    container:
      image: forgejo.coilysiren.me/coilyco-flight-deck/agentic-os:release
    env:
      TAG: ${{ needs.release.outputs.tag }}
      FORGEJO_BASE_URL: https://forgejo.coilysiren.me
      WARD_REPO: coilyco-flight-deck/ward
      TAP_REPO: coilyco-flight-deck/homebrew-tap
      TAP_WRITE_USER: coilyco-ops
      FORMULA_PATH: Formula/ward.rb
    steps:
      - uses: actions/checkout@v6

      - name: Bump tap formula and push
        env:
          TAP_WRITE_TOKEN: ${{ secrets.TAP_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          # Push auth is an explicit Actions secret, mirroring the draft asset
          # promotion job's guarded secret handling:
          # CI_RELEASE_TOKEN: one rotatable, visible credential instead of the
          # tap-writer runner's hidden git credential helper, which broke silently
          # and froze the tap at v0.96.0 (ward#237, ward#243). Guard up front so a
          # missing secret fails loudly here rather than at the push.
          if [ -z "${TAP_WRITE_TOKEN:-}" ]; then
            echo "::error::TAP_WRITE_TOKEN not set; cannot push tap formula" >&2
            exit 1
          fi
          version="${TAG#v}"
          # Resolve each asset to the URL that serves bytes and hash what it
          # serves (scripts/forgejo-asset-url.sh follows Forgejo's
          # attachment-metadata hops, ward#1493). The release API's own
          # browser_download_url points back at the metadata-serving download
          # route, so it cannot be used directly.
          download_base="$FORGEJO_BASE_URL/${WARD_REPO}/releases/download/${TAG}"
          resolve() {
            DOWNLOAD_BASE="$download_base" ASSET_NAME="$1" bash scripts/forgejo-asset-url.sh
          }
          out=$(resolve ward-darwin-amd64); darwin_amd64_url=${out% *}; darwin_amd64=${out#* }
          out=$(resolve ward-darwin-arm64); darwin_arm64_url=${out% *}; darwin_arm64=${out#* }
          out=$(resolve ward-linux-amd64); linux_amd64_url=${out% *}; linux_amd64=${out#* }
          out=$(resolve ward-linux-arm64); linux_arm64_url=${out% *}; linux_arm64=${out#* }
          # Stub guard: every fetched-bytes hash must match the release's own
          # SHA256SUMS, computed from the real binaries at build time. A
          # metadata body can never match, so any future Forgejo route change
          # fails loud here instead of shipping a broken formula.
          checksums=$(RELEASE_TAG="$TAG" ASSET_NAME=SHA256SUMS \
            FORGEJO_API="$FORGEJO_BASE_URL/api/v1/repos/${WARD_REPO}" \
            bash scripts/forgejo-release-asset.sh)
          check_sum() {
            expected=$(printf '%s\n' "$checksums" | awk -v a="$1" '$2 == a {print $1}')
            if [ -z "$expected" ] || [ "$2" != "$expected" ]; then
              echo "::error::hash mismatch for $1: fetched bytes ${2} vs SHA256SUMS ${expected:-<missing>}; refusing to write formula (ward#1493 stub guard)" >&2
              exit 1
            fi
          }
          check_sum ward-darwin-amd64 "$darwin_amd64"
          check_sum ward-darwin-arm64 "$darwin_arm64"
          check_sum ward-linux-amd64 "$linux_amd64"
          check_sum ward-linux-arm64 "$linux_arm64"

          # Clone the tap's live main and rewrite the formula in place. The
          # release-asset pins are the source of truth.
          git clone --depth 1 "$FORGEJO_BASE_URL/$TAP_REPO.git" tap
          cd tap
          VERSION="$version" \
          DARWIN_AMD64="$darwin_amd64" DARWIN_ARM64="$darwin_arm64" \
          LINUX_AMD64="$linux_amd64" LINUX_ARM64="$linux_arm64" \
          DARWIN_AMD64_URL="$darwin_amd64_url" DARWIN_ARM64_URL="$darwin_arm64_url" \
          LINUX_AMD64_URL="$linux_amd64_url" LINUX_ARM64_URL="$linux_arm64_url" \
          FORMULA_PATH="$FORMULA_PATH" \
          node -e '
            const fs = require("fs");
            const formula = [
              "class Ward < Formula",
              "  desc \"A contributor-facing cli-guard consumer\"",
              "  homepage \"https://forgejo.coilysiren.me/coilyco-flight-deck/ward\"",
              `  version \"${process.env.VERSION}\"`,
              "  license \"MIT\"",
              "",
              "  on_macos do",
              "    if Hardware::CPU.arm?",
              `      url \"${process.env.DARWIN_ARM64_URL}\"`,
              `      sha256 \"${process.env.DARWIN_ARM64}\"`,
              "      resource \"ward-linux\" do",
              `        url \"${process.env.LINUX_ARM64_URL}\"`,
              `        sha256 \"${process.env.LINUX_ARM64}\"`,
              "      end",
              "    else",
              `      url \"${process.env.DARWIN_AMD64_URL}\"`,
              `      sha256 \"${process.env.DARWIN_AMD64}\"`,
              "      resource \"ward-linux\" do",
              `        url \"${process.env.LINUX_AMD64_URL}\"`,
              `        sha256 \"${process.env.LINUX_AMD64}\"`,
              "      end",
              "    end",
              "  end",
              "",
              "  on_linux do",
              "    if Hardware::CPU.arm?",
              `      url \"${process.env.LINUX_ARM64_URL}\"`,
              `      sha256 \"${process.env.LINUX_ARM64}\"`,
              "    else",
              `      url \"${process.env.LINUX_AMD64_URL}\"`,
              `      sha256 \"${process.env.LINUX_AMD64}\"`,
              "    end",
              "  end",
              "",
              "  def install",
              "    asset =",
              "      if OS.mac?",
              "        Hardware::CPU.arm? ? \"ward-darwin-arm64\" : \"ward-darwin-amd64\"",
              "      else",
              "        Hardware::CPU.arm? ? \"ward-linux-arm64\" : \"ward-linux-amd64\"",
              "      end",
              "",
              "    chmod 0555, asset",
              "    bin.install asset => \"ward\"",
              "",
              "    if OS.mac?",
              "      resource(\"ward-linux\").stage do",
              "        sidecar = Hardware::CPU.arm? ? \"ward-linux-arm64\" : \"ward-linux-amd64\"",
              "        chmod 0555, sidecar",
              "        libexec.install sidecar",
              "      end",
              "    end",
              "",
              "    bin.install_symlink \"ward\" => \"warded\"",
              "",
              "  end",
              "",
              "  test do",
              "    assert_match \"v#{version}\", shell_output(\"#{bin}/ward version\")",
              "    # The warded multicall shim must be on PATH and point at the ward binary.",
              "    assert_predicate bin/\"warded\", :symlink?",
              "    assert_equal (bin/\"ward\").realpath, (bin/\"warded\").realpath",
              "  end",
              "end",
            ].join("\n") + "\n";
            fs.writeFileSync(process.env.FORMULA_PATH, formula);
          '

          if git diff --quiet -- "$FORMULA_PATH"; then
            echo "formula already at ${TAG}, nothing to push"
            exit 0
          fi
          git config user.name "forgejo-tap-writer"
          git config user.email "coilyco-ops@coilysiren.me"
          git commit -aqm "chore(formula): bump ward to ${TAG} [skip ci]"
          push_url="https://${TAP_WRITE_USER}:${TAP_WRITE_TOKEN}@forgejo.coilysiren.me/${TAP_REPO}.git"
          remote_formula_version() {
            remote_formula=$(curl -fsSL "$FORGEJO_BASE_URL/$TAP_REPO/raw/branch/main/$FORMULA_PATH" || true)
            printf '%s' "$remote_formula" | sed -n 's/^  version "\([^"]*\)"/\1/p' | head -1
          }
          for attempt in 1 2 3; do
            remote_version=$(remote_formula_version || true)
            if [ "$remote_version" = "$version" ]; then
              echo "tap ${TAP_REPO} already serves ${TAG}, nothing to push"
              exit 0
            fi
            if [ -n "$remote_version" ] && [ "$remote_version" != "$version" ] && \
              [ "$(printf '%s\n%s\n' "$version" "$remote_version" | sort -V | tail -1)" = "$remote_version" ]; then
              echo "tap ${TAP_REPO} already serves newer ${remote_version}; skipping stale bump ${TAG}"
              exit 0
            fi
            if git push "$push_url" HEAD:main; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::push of ${FORMULA_PATH} to ${TAP_REPO} failed after 3 attempts; TAP_WRITE_TOKEN is likely missing, rotated, or lacks push scope (see docs/release.md)" >&2
              exit 1
            fi
            echo "tap push attempt ${attempt} failed; retrying in 5s" >&2
            sleep 5
          done

          published=$(curl -fsSL "$FORGEJO_BASE_URL/$TAP_REPO/raw/branch/main/$FORMULA_PATH" || true)
          if ! printf '%s' "$published" | grep -q "version \"${version}\""; then
            echo "::error::tap ${TAP_REPO} main does not serve ${TAG} after push; formula bump did not land" >&2
            exit 1
          fi
          if ! printf '%s' "$published" | grep -qF "$darwin_amd64_url"; then
            echo "::error::tap ${TAP_REPO} main does not serve the resolved asset URL for ${TAG} after push" >&2
            exit 1
          fi
          echo "tap ${TAP_REPO} formula bumped to ${TAG}"

      - name: Alert Telegram on main failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_RED_CHAT_ID }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          JOB: ${{ github.job }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          API_BASE: https://api.telegram.org
        run: "python3 -c 'exec(\"import os\\nimport sys\\nimport urllib.error\\nimport urllib.parse\\nimport urllib.request\\n\\ndef build_message():\\n    return \\\"\\\\n\\\".join([\\n        \\\"CI failed on main\\\",\\n        f\\\"repo: {os.environ['\"'\"'REPO'\"'\"']}\\\",\\n        f\\\"workflow: {os.environ['\"'\"'WORKFLOW'\"'\"']}\\\",\\n        f\\\"job: {os.environ['\"'\"'JOB'\"'\"']}\\\",\\n        f\\\"ref: {os.environ['\"'\"'REF'\"'\"']}\\\",\\n        f\\\"sha: {os.environ['\"'\"'SHA'\"'\"']}\\\",\\n        f\\\"run: {os.environ['\"'\"'RUN_URL'\"'\"']}\\\",\\n    ])\\n\\ndef main():\\n    bot_token = os.environ.get(\\\"BOT_TOKEN\\\", \\\"\\\")\\n    chat_id = os.environ.get(\\\"CHAT_ID\\\", \\\"\\\")\\n    if not bot_token or not chat_id:\\n        print(\\\"telegram alert missing required secret\\\", file=sys.stderr)\\n        return 2\\n    proxy_url = os.environ.get(\\\"FORGEJO_EGRESS_PROXY\\\", \\\"\\\").strip()\\n    payload = urllib.parse.urlencode(\\n        {\\n            \\\"chat_id\\\": chat_id,\\n            \\\"text\\\": build_message(),\\n            \\\"disable_web_page_preview\\\": \\\"true\\\",\\n        }\\n    ).encode(\\\"utf-8\\\")\\n    api_base = os.environ.get(\\\"API_BASE\\\", \\\"https://api.telegram.org\\\").rstrip(\\\"/\\\")\\n    request = urllib.request.Request(\\n        f\\\"{api_base}/bot{bot_token}/sendMessage\\\",\\n        data=payload,\\n        method=\\\"POST\\\",\\n    )\\n    opener = urllib.request.build_opener(\\n        urllib.request.ProxyHandler({\\\"https\\\": proxy_url})\\n        if proxy_url\\n        else urllib.request.ProxyHandler()\\n    )\\n    try:\\n        with opener.open(request, timeout=15) as response:\\n            response.read()\\n    except urllib.error.URLError as exc:\\n        print(f\\\"telegram alert failed ({type(exc).__name__})\\\", file=sys.stderr)\\n        return 1\\n    return 0\\n\\nraise SystemExit(main())\\n\")'"
  bump-scoop-manifest:
    needs: [release, promote-draft-assets]
    if: ${{ needs.release.outputs.tag != '' }}
    runs-on: docker
    container:
      image: forgejo.coilysiren.me/coilyco-flight-deck/agentic-os:release
    env:
      TAG: ${{ needs.release.outputs.tag }}
      FORGEJO_BASE_URL: https://forgejo.coilysiren.me
      WARD_REPO: coilyco-flight-deck/ward
      BUCKET_REPO: coilyco-flight-deck/scoop-bucket
      MANIFEST_PATH: bucket/ward.json
    steps:
      - uses: actions/checkout@v6

      - name: Write ward.json to the scoop bucket and push
        env:
          SCOOP_WRITE_TOKEN: ${{ secrets.SCOOP_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          # Windows sibling of bump-tap-formula: push the scoop manifest at release
          # time instead of leaving the bucket to a daily autoupdate poll (ward#571).
          # scoop's ward.json used to refresh only on a bucket-side cron, so it lagged
          # however many releases landed between runs (minor bump every push to main);
          # writing it from the tag build is the push-not-poll fix the tap already has.
          # The bucket is Forgejo-canonical (users add it from forgejo.coilysiren.me,
          # checkver reads the Forgejo releases.atom), so the manifest is written where
          # scoop reads it, not the GitHub mirror. See docs/release.md.
          # Push auth is an explicit Actions secret, mirroring bump-tap-formula's
          # TAP_WRITE_TOKEN: one rotatable, visible credential. Unlike the tap,
          # the scoop bucket is a best-effort install channel side effect, so a
          # missing secret warns and leaves the Forgejo release green instead of
          # turning the release red on an external bucket sync.
          if [ -z "${SCOOP_WRITE_TOKEN:-}" ]; then
            echo "::warning::SCOOP_WRITE_TOKEN not set; skipping scoop manifest bump for ${BUCKET_REPO}. See docs/release.md." >&2
            exit 0
          fi
          VER="${TAG#v}"
          # Resolve the sidecar assets through the release API, then read the
          # asset bodies. That keeps Scoop on the raw 64-hex digest even if the
          # public download route hands back metadata JSON instead of the file
          # body.
          amd64_hash=$(RELEASE_TAG="$TAG" ASSET_NAME=ward-windows-amd64.exe.sha256 \
            FORGEJO_API="$FORGEJO_BASE_URL/api/v1/repos/${WARD_REPO}" \
            bash scripts/forgejo-release-asset.sh | tr -d '[:space:]')
          arm64_hash=$(RELEASE_TAG="$TAG" ASSET_NAME=ward-windows-arm64.exe.sha256 \
            FORGEJO_API="$FORGEJO_BASE_URL/api/v1/repos/${WARD_REPO}" \
            bash scripts/forgejo-release-asset.sh | tr -d '[:space:]')
          checksums=$(RELEASE_TAG="$TAG" ASSET_NAME=SHA256SUMS \
            FORGEJO_API="$FORGEJO_BASE_URL/api/v1/repos/${WARD_REPO}" \
            bash scripts/forgejo-release-asset.sh)
          linux_amd64_hash=$(printf '%s\n' "$checksums" | awk '$2 == "ward-linux-amd64" {print $1}')
          linux_arm64_hash=$(printf '%s\n' "$checksums" | awk '$2 == "ward-linux-arm64" {print $1}')
          # Concrete manifest URLs must serve bytes: Forgejo hands back
          # asset-metadata JSON on releases/download regardless of Accept
          # (ward#1493), so resolve each binary asset through the metadata
          # hops to its /attachments/<uuid> URL. The autoupdate block keeps
          # the download-route templates as the bucket-side poll safety net;
          # push-not-poll rewrites this manifest with resolved URLs on every
          # release anyway.
          download_base="$FORGEJO_BASE_URL/${WARD_REPO}/releases/download/${TAG}"
          resolve_url() {
            DOWNLOAD_BASE="$download_base" ASSET_NAME="$1" bash scripts/forgejo-asset-url.sh | awk '{print $1}'
          }
          win_amd64_url=$(resolve_url ward-windows-amd64.exe)
          win_arm64_url=$(resolve_url ward-windows-arm64.exe)
          linux_amd64_url=$(resolve_url ward-linux-amd64)
          linux_arm64_url=$(resolve_url ward-linux-arm64)
          for u in "$win_amd64_url" "$win_arm64_url" "$linux_amd64_url" "$linux_arm64_url"; do
            case "$u" in
              https://*) ;;
              *)
                echo "::error::release ${TAG} asset did not resolve to a browser_download_url (got '${u}'); refusing to write manifest" >&2
                exit 1
                ;;
            esac
          done
          for h in "$amd64_hash" "$arm64_hash" "$linux_amd64_hash" "$linux_arm64_hash"; do
            if ! printf '%s' "$h" | grep -Eq '^[0-9a-f]{64}$'; then
              echo "::error::sidecar digest '${h}' is not a 64-hex sha256; refusing to write manifest" >&2
              exit 1
            fi
          done

          # Clone the bucket's live main and rewrite the whole manifest. Writing the
          # FULL file (not an in-place version patch) is deliberate: it is self-healing
          # - the first release creates ward.json even though the bucket has none yet,
          # and ward stays the single source of truth for its own manifest. The
          # checkver/autoupdate blocks are kept so a bucket-side poll still works as a
          # safety net if a push is ever missed.
          git clone --depth 1 "$FORGEJO_BASE_URL/$BUCKET_REPO.git" bucket
          cd bucket
          mkdir -p "$(dirname "$MANIFEST_PATH")"
          # Generate with node (present on the docker runner, used elsewhere in this
          # pipeline) so the JSON is always well-formed - no hand-quoting of hashes.
          VER="$VER" AMD64_HASH="$amd64_hash" ARM64_HASH="$arm64_hash" \
          LINUX_AMD64_HASH="$linux_amd64_hash" LINUX_ARM64_HASH="$linux_arm64_hash" \
          WIN_AMD64_URL="$win_amd64_url" WIN_ARM64_URL="$win_arm64_url" \
          LINUX_AMD64_URL="$linux_amd64_url" LINUX_ARM64_URL="$linux_arm64_url" \
          WARD_REPO="$WARD_REPO" FORGEJO_BASE_URL="$FORGEJO_BASE_URL" \
          MANIFEST_PATH="$MANIFEST_PATH" \
          node -e '
            const b = process.env.FORGEJO_BASE_URL + "/" + process.env.WARD_REPO;
            const rel = b + "/releases/download";
            const m = {
              version: process.env.VER,
              description: "Audited verb gate + operator surface: the CLI contributors and agents route build/test/lint and operator ops through.",
              homepage: b,
              license: "MIT",
              architecture: {
                "64bit": {
                  url: [
                    process.env.WIN_AMD64_URL + "#/ward.exe",
                    process.env.LINUX_AMD64_URL + "#/ward-linux-amd64",
                  ],
                  hash: [process.env.AMD64_HASH, process.env.LINUX_AMD64_HASH],
                },
                arm64: {
                  url: [
                    process.env.WIN_ARM64_URL + "#/ward.exe",
                    process.env.LINUX_ARM64_URL + "#/ward-linux-arm64",
                  ],
                  hash: [process.env.ARM64_HASH, process.env.LINUX_ARM64_HASH],
                },
              },
              bin: "ward.exe",
              checkver: { url: b + "/releases.atom", regex: "releases/tag/v([\\d.]+)" },
              autoupdate: {
                architecture: {
                  "64bit": {
                    url: [
                      rel + "/v$version/ward-windows-amd64.exe#/ward.exe",
                      rel + "/v$version/ward-linux-amd64#/ward-linux-amd64",
                    ],
                    hash: { url: "$url.sha256" },
                  },
                  arm64: {
                    url: [
                      rel + "/v$version/ward-windows-arm64.exe#/ward.exe",
                      rel + "/v$version/ward-linux-arm64#/ward-linux-arm64",
                    ],
                    hash: { url: "$url.sha256" },
                  },
                },
              },
            };
            require("fs").writeFileSync(process.env.MANIFEST_PATH, JSON.stringify(m, null, 4) + "\n");
          '

          # Stage and compare against HEAD. `git add` + `diff --cached` detects both
          # a version change and a brand-new (untracked) ward.json, so a re-run of the
          # same tag stays idempotent (empty diff -> skip) while the first release,
          # which creates the file, is correctly seen as a change.
          git add "$MANIFEST_PATH"
          if git diff --cached --quiet -- "$MANIFEST_PATH"; then
            echo "manifest already at ${TAG}, nothing to push"
            exit 0
          fi
          # Attribute to the coilyco-ops bot via its Forgejo-registered email, the
          # same identity bump-tap-formula uses (ward#245, docs/agent-attribution.md).
          git config user.name "forgejo-scoop-writer"
          git config user.email "coilyco-ops@coilysiren.me"
          git commit -qm "chore(ward): bump scoop manifest to ${TAG} [skip ci]"
          # Push auth in the URL; never echoed (no set -x, git masks URL credentials).
          # A non-zero push (missing/rotated/under-scoped token) fails the job loudly
          # rather than stalling the manifest behind a green release.
          push_url="https://coilysiren:${SCOOP_WRITE_TOKEN}@forgejo.coilysiren.me/${BUCKET_REPO}.git"
          if ! git push "$push_url" HEAD:main; then
            echo "::warning::push of ${MANIFEST_PATH} to ${BUCKET_REPO} failed; skipping scoop manifest bump (see docs/release.md)" >&2
            exit 0
          fi

          # Read the bucket back and confirm main now serves ${VER}. Catches a push
          # that reports success but does not land, so a stale manifest can never
          # masquerade as a green release (the ward#237 acceptance, applied to scoop).
          published=$(curl -fsSL "$FORGEJO_BASE_URL/$BUCKET_REPO/raw/branch/main/$MANIFEST_PATH" || true)
          if ! printf '%s' "$published" | grep -q "\"version\": \"${VER}\""; then
            echo "::warning::bucket ${BUCKET_REPO} main does not serve ${VER} after push; skipping scoop manifest bump follow-up" >&2
            exit 0
          fi
          echo "bucket ${BUCKET_REPO} scoop manifest bumped to ${TAG}"
      - name: Alert Telegram on main failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_RED_CHAT_ID }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          JOB: ${{ github.job }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          API_BASE: https://api.telegram.org
        run: "python3 -c 'exec(\"import os\\nimport sys\\nimport urllib.error\\nimport urllib.parse\\nimport urllib.request\\n\\ndef build_message():\\n    return \\\"\\\\n\\\".join([\\n        \\\"CI failed on main\\\",\\n        f\\\"repo: {os.environ['\"'\"'REPO'\"'\"']}\\\",\\n        f\\\"workflow: {os.environ['\"'\"'WORKFLOW'\"'\"']}\\\",\\n        f\\\"job: {os.environ['\"'\"'JOB'\"'\"']}\\\",\\n        f\\\"ref: {os.environ['\"'\"'REF'\"'\"']}\\\",\\n        f\\\"sha: {os.environ['\"'\"'SHA'\"'\"']}\\\",\\n        f\\\"run: {os.environ['\"'\"'RUN_URL'\"'\"']}\\\",\\n    ])\\n\\ndef main():\\n    bot_token = os.environ.get(\\\"BOT_TOKEN\\\", \\\"\\\")\\n    chat_id = os.environ.get(\\\"CHAT_ID\\\", \\\"\\\")\\n    if not bot_token or not chat_id:\\n        print(\\\"telegram alert missing required secret\\\", file=sys.stderr)\\n        return 2\\n    proxy_url = os.environ.get(\\\"FORGEJO_EGRESS_PROXY\\\", \\\"\\\").strip()\\n    payload = urllib.parse.urlencode(\\n        {\\n            \\\"chat_id\\\": chat_id,\\n            \\\"text\\\": build_message(),\\n            \\\"disable_web_page_preview\\\": \\\"true\\\",\\n        }\\n    ).encode(\\\"utf-8\\\")\\n    api_base = os.environ.get(\\\"API_BASE\\\", \\\"https://api.telegram.org\\\").rstrip(\\\"/\\\")\\n    request = urllib.request.Request(\\n        f\\\"{api_base}/bot{bot_token}/sendMessage\\\",\\n        data=payload,\\n        method=\\\"POST\\\",\\n    )\\n    opener = urllib.request.build_opener(\\n        urllib.request.ProxyHandler({\\\"https\\\": proxy_url})\\n        if proxy_url\\n        else urllib.request.ProxyHandler()\\n    )\\n    try:\\n        with opener.open(request, timeout=15) as response:\\n            response.read()\\n    except urllib.error.URLError as exc:\\n        print(f\\\"telegram alert failed ({type(exc).__name__})\\\", file=sys.stderr)\\n        return 1\\n    return 0\\n\\nraise SystemExit(main())\\n\")'"
