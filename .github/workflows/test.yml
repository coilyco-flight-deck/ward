# Mirror pair (ward#214): .github/workflows/test.yml and .forgejo/workflows/test.yml
# are kept identical except runs-on by scripts/check_workflow_mirror.py, so canonical
# Forgejo pushes run the same checks GitHub does. The GitHub file is the source; edit
# it (or both), then run `make lint-workflows ARGS=--fix`. See docs/workflow-mirror.md.
# Security: no untrusted github.event.* reaches run blocks; all commands are static.
# PR-only on purpose: promote.yml runs the same checks on push to main, so a
# main trigger here would start a second copy of the same job in the same
# second, on the same runner, against the same checkout. That race reddened
# main while the sibling job went green.

name: test

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: forgejo.coilysiren.me/coilyco-flight-deck/agentic-os:release
    steps:
      - name: checkout
        run: |
          # Script checkout: the lang-go job image carries no node runtime,
          # so the actions/checkout node action cannot exec here. Anonymous
          # fetch of the public repo, full history + tags, no credential
          # ever written to git config (the promote push builds its own
          # PAT URL).
          set -euo pipefail
          git config --global --add safe.directory "$(pwd)"
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch -q --tags origin "+refs/heads/*:refs/remotes/origin/*" "+${GITHUB_REF}:refs/ci-trigger"
          git checkout -q --detach "$GITHUB_SHA" 2>/dev/null || git checkout -q --detach refs/ci-trigger

      - name: go vet
        run: make vet

      - name: go test
        run: make test

      - name: golangci-lint
        timeout-minutes: 5
        env:
          GOLANGCI_LINT_VERSION: "2.12.2"
          TMPDIR: ${{ runner.tool_cache }}/ward-tmp
          GOTMPDIR: ${{ runner.tool_cache }}/ward-go-tmp
          GOCACHE: ${{ runner.tool_cache }}/ward-go-build
          GOMODCACHE: ${{ runner.tool_cache }}/ward-go-mod
        run: |
          # The lang-go tier ships Go but not golangci-lint (that lived in the
          # retired full tier), so install the same pinned version the full
          # image baked before running the lint gate.
          if ! command -v golangci-lint >/dev/null 2>&1; then
            arch=$(uname -m)
            case "$arch" in x86_64) arch=amd64 ;; aarch64) arch=arm64 ;; esac
            curl -fsSL "https://github.com/golangci/golangci-lint/releases/download/v${GOLANGCI_LINT_VERSION}/golangci-lint-${GOLANGCI_LINT_VERSION}-linux-${arch}.tar.gz" \
              | tar -xz -C /usr/local/bin --strip-components=1 \
                "golangci-lint-${GOLANGCI_LINT_VERSION}-linux-${arch}/golangci-lint"
          fi
          mkdir -p "$TMPDIR" "$GOTMPDIR" "$GOCACHE" "$GOMODCACHE" && make lint
      - name: Alert Telegram on main failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_RED_CHAT_ID }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          JOB: ${{ github.job }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          API_BASE: https://api.telegram.org
        run: "python3 -c 'exec(\"import os\\nimport sys\\nimport urllib.error\\nimport urllib.parse\\nimport urllib.request\\n\\ndef build_message():\\n    return \\\"\\\\n\\\".join([\\n        \\\"CI failed on main\\\",\\n        f\\\"repo: {os.environ['\"'\"'REPO'\"'\"']}\\\",\\n        f\\\"workflow: {os.environ['\"'\"'WORKFLOW'\"'\"']}\\\",\\n        f\\\"job: {os.environ['\"'\"'JOB'\"'\"']}\\\",\\n        f\\\"ref: {os.environ['\"'\"'REF'\"'\"']}\\\",\\n        f\\\"sha: {os.environ['\"'\"'SHA'\"'\"']}\\\",\\n        f\\\"run: {os.environ['\"'\"'RUN_URL'\"'\"']}\\\",\\n    ])\\n\\ndef main():\\n    bot_token = os.environ.get(\\\"BOT_TOKEN\\\", \\\"\\\")\\n    chat_id = os.environ.get(\\\"CHAT_ID\\\", \\\"\\\")\\n    if not bot_token or not chat_id:\\n        print(\\\"telegram alert missing required secret\\\", file=sys.stderr)\\n        return 2\\n    proxy_url = os.environ.get(\\\"FORGEJO_EGRESS_PROXY\\\", \\\"\\\").strip()\\n    payload = urllib.parse.urlencode(\\n        {\\n            \\\"chat_id\\\": chat_id,\\n            \\\"text\\\": build_message(),\\n            \\\"disable_web_page_preview\\\": \\\"true\\\",\\n        }\\n    ).encode(\\\"utf-8\\\")\\n    api_base = os.environ.get(\\\"API_BASE\\\", \\\"https://api.telegram.org\\\").rstrip(\\\"/\\\")\\n    request = urllib.request.Request(\\n        f\\\"{api_base}/bot{bot_token}/sendMessage\\\",\\n        data=payload,\\n        method=\\\"POST\\\",\\n    )\\n    opener = urllib.request.build_opener(\\n        urllib.request.ProxyHandler({\\\"https\\\": proxy_url})\\n        if proxy_url\\n        else urllib.request.ProxyHandler()\\n    )\\n    try:\\n        with opener.open(request, timeout=15) as response:\\n            response.read()\\n    except urllib.error.URLError as exc:\\n        print(f\\\"telegram alert failed ({type(exc).__name__})\\\", file=sys.stderr)\\n        return 1\\n    return 0\\n\\nraise SystemExit(main())\\n\")'"
