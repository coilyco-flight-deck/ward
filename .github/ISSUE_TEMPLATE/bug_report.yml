name: Bug report
description: Something in ward is broken or behaves differently than documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. ward is Forgejo-canonical and mirrored read-only to
        GitHub, but **GitHub is the front door** - filing here is correct. A
        maintainer carries accepted work onto Forgejo `main`. See
        [CONTRIBUTING.md](https://github.com/coilyco-flight-deck/ward/blob/main/CONTRIBUTING.md).

        Security vulnerabilities do **not** go here - follow
        [SECURITY.md](https://github.com/coilyco-flight-deck/ward/blob/main/SECURITY.md).
  - type: dropdown
    id: surface
    attributes:
      label: Which surface
      description: Where does the bug live?
      options:
        - The dev-verb gate (ward exec / doctor / git / pkg / audit)
        - The agent driver (ward agent / warded)
        - The operator surface (ward ops ...)
        - The Claude Code hook (ward hook / install-hooks)
        - Install / release / homebrew tap
        - Other / not sure
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you run, and what did ward do?
      placeholder: "$ ward exec test\n..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: What should have happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Smallest sequence that triggers it.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ward version
      description: Output of `ward --version` (or the commit you pinned).
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and install method
      description: e.g. "macOS 15, brew" or "Linux, pinned commit".
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before filing
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: This is not a security vulnerability (those follow SECURITY.md).
          required: true
