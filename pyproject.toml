# Config for the agentic-os catalog pre-commit hooks. ward ships no Python;
# this file exists only to carry per-repo hook opt-outs, which the
# tree-walking hooks read here (they bypass pre-commit's own exclude:).

[tool.agentic-os.documentation-layout]
# The root README is the launch-grade front page a cold visitor reads to decide
# whether ward is for them - it earns room to name who it's for and what it
# requires, show a denial, and route into the 60+ docs/ files, past the trifecta
# default (160 lines / 12500 chars). ward#500 advanced the managed-hook pin to
# the aos release carrying the per-repo README opt-up (agentic-os v0.167.0,
# driver ward#427), so the README is now enforced at a tighter explicit ceiling
# sized to the landed launch README (129 lines / 13268 chars) with headroom.
# Supersedes the #274 "split it back under cap" plan. ward#445 raised the char
# ceiling once more so the Status section can carry the release-cadence and
# who-relies-on-it context a cold reader needs (after trimming duplicate
# forge-agnostic prose to keep the bump small).
readme_max_lines = 130
readme_max_chars = 13450
excludes = [
  # Pre-existing size debt: docs/hook.md is 92 lines, over the 80-line cap.
  # The split is tracked in coilyco-flight-deck/ward#50; drop this when it lands.
  "docs/hook.md",
  # Generated surface reference (specverb-gen). The driver emits one beside each
  # Guardfile; the reviewed copies are committed under docs/ward-kdl/ (ward#279)
  # and grow with the verb surface, so the layout size cap does not apply. One
  # slash-less basename glob covers every generated doc wherever it lands - the
  # reviewed copy under docs/ward-kdl/ and the gitignored beside-the-kdl emission
  # under cmd/ward-kdl/ (incl. the per-tier ward-kdl-<read,write,admin>/ subdirs,
  # ward#240). The directory pattern keeps the docs/ward-kdl/ subfolder itself
  # from tripping the docs-flatness rule.
  "ward-kdl.*.guardfile.md",
  "docs/ward-kdl/**",
  # Embedded container agent doctrine: a ward binary asset (go:embed), not a
  # doc, and it must sit beside its package, so the markdown-location and size
  # caps do not apply. See docs/container.md.
  "cmd/ward/containerassets/AGENTS.container.md",
  # The docs/ landing page (ward#488): an index of every docs/*.md, so it grows
  # with the doc set and cannot fit the 80-line/4000-char cap by construction -
  # same "grows with the surface" carve-out as the generated ward-kdl refs
  # above. dead-cross-links still validates every entry (its own exclude list,
  # not this one).
  "docs/README.md",
  # Field-by-field .ward/ward.yaml schema reference (ward#436): a single-source
  # render of cli-guard's repocfg struct - every commands/security key plus one
  # complete annotated example (the example YAML alone is ~2KB). It must stay
  # one self-contained doc so an agent can author a config from ward docs alone
  # (the issue's done-condition), and a full config reference cannot fit the
  # 80-line/4000-char flat cap by construction - same "reference that grows with
  # the surface" carve-out as docs/README.md above. dead-cross-links still
  # validates every entry (its own exclude list, not this one).
  "docs/ward-yaml.md",
  # --- ward#289 doc_goal front-matter bridge (remove when ward#556 lands) ---
  # ward#289 added a `doc_goal:` front-matter line to every doc so each grades
  # against an explicit target (the doc-grader reads it, then strips it). The
  # pinned documentation-layout hook counts the whole file - front-matter
  # included - against the flat 80-line/4000-char cap, and nearly every ward doc
  # is authored right at that ceiling, so the 3-line metadata block tips these
  # over even though not one line of prose grew. Front-matter is metadata, not
  # prose, so the real fix is to exempt it from the size count upstream in
  # check_documentation_layout.py, then delete this block - tracked in ward#556.
  # Until it lands these docs (all already at the cap) opt out of the size gate
  # rather than shed real content or the grading target. dead-cross-links and
  # every other layout rule still apply.
  "docs/FEATURES.md",
  "docs/agent-adapter-manifest.md",
  "docs/agent-advisor.md",
  "docs/agent-attribution.md",
  "docs/agent-director-dispatch.md",
  "docs/agent-dispatch-contract.md",
  "docs/agent-engineer.md",
  "docs/agent-github.md",
  "docs/agent-goose.md",
  "docs/agent-host-net.md",
  "docs/agent-local-model.md",
  "docs/agent-observability.md",
  "docs/agent-preflight.md",
  "docs/agent-reservation.md",
  "docs/agent-subcommands.md",
  "docs/agent-surface.md",
  "docs/agent-trust-gate.md",
  "docs/agent-ts-sidecar.md",
  "docs/agent-workflow.md",
  "docs/agent.md",
  "docs/agents-list.md",
  "docs/agentsapi.md",
  "docs/broker.md",
  "docs/comparison-openshell.md",
  "docs/container-api.md",
  "docs/container-cleanup.md",
  "docs/container-env.md",
  "docs/container-lifecycle-logs.md",
  "docs/container-multi-repo.md",
  "docs/container-permissions.md",
  "docs/container-reap.md",
  "docs/container.md",
  "docs/context-probe.md",
  "docs/demo.md",
  "docs/director-startup-triage.md",
  "docs/doctor.md",
  "docs/exec-verb.md",
  "docs/first-run.md",
  "docs/git-verbs.md",
  "docs/github-mirror.md",
  "docs/github-token.md",
  "docs/guardfile-grammar.md",
  "docs/ops-forgejo-admin.md",
  "docs/ops-forgejo-in-ward.md",
  "docs/ops-forgejo.md",
  "docs/release.md",
  "docs/troubleshooting.md",
  "docs/ward-kdl-in-ward.md",
  "docs/ward-kdl-surface.md",
  "docs/ward-kdl-tiers.md",
]

[tool.agentic-os.dead-cross-links]
# Generated surface reference (specverb-gen), same carve-out as the
# documentation-layout size exclude above. The guardfile refs reproduce the
# upstream OpenAPI `description` prose verbatim, which for some APIs (Trello)
# carries site-absolute doc links like `/cloud/trello/guides/...` - external
# Atlassian URLs missing their `https://developer.atlassian.com` host. The
# v0.167.0 dead-cross-links resolves those against the repo root and flags them
# as repo-escaping. They are not ward-authored cross-links, so excluding the
# generated surface (no hand-written repo links live here) unblocks the pin
# advance; the durable fix is teaching the ward-kdl generator to absolutize
# upstream relative links so this exclude can drop. Tracked: ward#501.
excludes = [
  "ward-kdl.*.guardfile.md",
  "docs/ward-kdl/**",
]

[tool.agentic-os.code-comments]
excludes = [
  # Managed by apply-agentic-os-hooks.py: the BEGIN/END markers are generated
  # comments past line 1, so the YAML rule cannot apply. Mirrors agentic-os.
  ".pre-commit-config.yaml",
]
