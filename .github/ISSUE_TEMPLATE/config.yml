# GitHub issue-form chooser config for the mirror. Templates render at
# github.com/coilyco-flight-deck/ward/issues/new/choose - the "New issue" link
# in README.md. ward is Forgejo-canonical; GitHub is the read-only mirror and
# the external front door where public issues and PRs are filed (see #438/#481).
# See CONTRIBUTING.md.
blank_issues_enabled: false
contact_links:
  - name: Security vulnerability (do not file a public issue)
    url: https://github.com/coilyco-flight-deck/ward/blob/main/SECURITY.md
    about: Vulnerabilities are disclosed privately per SECURITY.md, by email - never as a public issue.
  - name: How contributions land (Forgejo-canonical, GitHub front door)
    url: https://github.com/coilyco-flight-deck/ward/blob/main/CONTRIBUTING.md
    about: ward is canonical on Forgejo and mirrored read-only to GitHub. Read this before opening a PR.
