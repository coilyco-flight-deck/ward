# Forgejo-canonical release pipeline. See docs/release.md.

name: release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: docker
    outputs:
      tag: ${{ steps.tag.outputs.new_tag }}
      version: ${{ steps.tag.outputs.new_version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: tag
        uses: coilysiren/agentic-os/actions/tag-bump@main

      - id: notes
        if: ${{ steps.tag.outputs.new_tag != '' }}
        shell: bash
        env:
          PREV_TAG: ${{ steps.tag.outputs.previous_tag }}
          NEW_TAG: ${{ steps.tag.outputs.new_tag }}
          COMPARE_URL: https://forgejo.coilysiren.me/coilyco-flight-deck/ward
          FALLBACK: ${{ steps.tag.outputs.changelog }}
        run: |
          set -euo pipefail
          # Reshape tag-bump's raw `git log` changelog into user-facing,
          # categorised notes (ward#486, docs/release-notes.md). Same range
          # tag-bump uses (previous_tag..HEAD, HEAD == the released SHA); a
          # missing previous_tag (first release) degrades to HEAD. On any
          # failure fall back to the raw changelog, never an empty body.
          if [ -n "$PREV_TAG" ]; then range="${PREV_TAG}..HEAD"; else range="HEAD"; fi
          # Commits whose full message (body included) carries a BREAKING note;
          # the script only sees subjects, so body-footer breaks are found here.
          breaking=$(git log --pretty=format:'%h' --grep='BREAKING' "$range" | tr '\n' ' ')
          if body=$(git log --pretty=format:'%h%x09%s' "$range" \
              | bash scripts/release-notes.sh \
                  --prev "$PREV_TAG" --new "$NEW_TAG" --compare-url "$COMPARE_URL" \
                  --breaking-hashes "$breaking") \
              && [ -n "$body" ]; then
            :
          else
            echo "::warning::release-notes.sh produced no body; falling back to the raw changelog" >&2
            body="$FALLBACK"
          fi
          {
            echo "body<<WARD_RELEASE_NOTES_EOF"
            echo "$body"
            echo "WARD_RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - id: create
        if: ${{ steps.tag.outputs.new_tag != '' }}
        uses: coilysiren/agentic-os/actions/create-release@main
        with:
          tag: ${{ steps.tag.outputs.new_tag }}
          name: ${{ steps.tag.outputs.new_tag }}
          body: ${{ steps.notes.outputs.body }}

  publish-binaries:
    needs: release
    if: ${{ needs.release.outputs.tag != '' }}
    runs-on: docker
    env:
      TAG: ${{ needs.release.outputs.tag }}
      GO_VERSION: "1.26.4"
      FORGEJO_API: https://forgejo.coilysiren.me/api/v1/repos/coilyco-flight-deck/ward
      GITHUB_REPO: coilyco-flight-deck/ward
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release.outputs.tag }}
          fetch-depth: 0

      - name: Install Go
        run: |
          set -euo pipefail
          curl -fsSL "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz" -o /tmp/go.tar.gz
          tar -xzf /tmp/go.tar.gz -C /usr/local
          echo "/usr/local/go/bin" >> "$GITHUB_PATH"

      - name: Cross-compile the full ward matrix (darwin + linux + windows, amd64 + arm64)
        timeout-minutes: 12
        run: |
          set -euo pipefail
          # GOPROXY=direct so fresh cli-guard pseudo-versions resolve for the
          # release build. See docs/release-binaries.md. CGO stays off so every
          # target cross-compiles from this linux/amd64 runner with no C
          # toolchain - ward is pure Go (no `import "C"`). Building the whole
          # matrix ONCE and uploading the same files to both forges is what
          # guarantees the Forgejo and GitHub release pages carry identical
          # SHA256SUMS for a tag (ward#454, ward#438). Windows joins the matrix so
          # the scoop channel (coilyco-flight-deck/scoop-bucket ward.json) has a binary to
          # install; its .exe assets also get per-asset .sha256 sidecars below,
          # the contract scoop autoupdate reads (ward#561).
          export GOPROXY=direct GOSUMDB=off CGO_ENABLED=0
          mkdir -p dist
          # Pre-fetch modules in a bounded, retried block before building. A
          # GOPROXY=direct git fetch hung ~5min then failed in run 405 and shipped
          # v0.149.0 with zero binaries: the build step died, so the Upload step
          # never ran. The only network-flaky part is resolving the cli-guard
          # pseudo-version; bounding each attempt and retrying lets a transient
          # hang recover instead of silently dropping a release's assets. The
          # go build below then runs against the warm cache. See docs/release.md.
          bound() { if command -v timeout >/dev/null 2>&1; then timeout 180 "$@"; else "$@"; fi; }
          for attempt in 1 2 3; do
            if bound go mod download; then break; fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::go mod download failed after 3 attempts (GOPROXY=direct fetch); release binaries not built" >&2
              exit 1
            fi
            echo "go mod download attempt ${attempt} failed/timed out; retrying in 5s" >&2
            sleep 5
          done
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              # Windows PE binaries carry the .exe suffix scoop and the OS expect.
              ext=""; [ "$os" = "windows" ] && ext=".exe"
              GOOS="$os" GOARCH="$arch" go build -trimpath \
                -ldflags "-s -w -X main.Version=${TAG}" \
                -o "dist/ward-${os}-${arch}${ext}" ./cmd/ward
            done
          done
          # SHA256SUMS over the bare basenames, so `sha256sum -c SHA256SUMS`
          # verifies from whichever release page a downloader pulled the binary.
          ( cd dist && sha256sum ward-* > SHA256SUMS )
          # Per-asset .sha256 sidecars for the windows exes: scoop autoupdate reads
          # each app's hash from `<asset>.sha256` (bare digest), the fleet contract
          # coily.json already relies on. Only windows needs them - brew/raw-binary
          # installs verify against the combined SHA256SUMS above. See ward#561.
          ( cd dist && for f in ward-windows-*.exe; do
              sha256sum "$f" | awk '{print $1}' > "${f}.sha256"
            done )
          ls -l dist
          cat dist/SHA256SUMS

      - name: Upload assets to the Forgejo release
        env:
          TOKEN: ${{ secrets.CI_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ]; then
            echo "::error::CI_RELEASE_TOKEN not set; cannot upload release assets" >&2
            exit 1
          fi
          rel_id=$(curl -fsSL -H "Authorization: token ${TOKEN}" \
            "${FORGEJO_API}/releases/tags/${TAG}" \
            | grep -oE '"id"[[:space:]]*:[[:space:]]*[0-9]+' | head -1 | grep -oE '[0-9]+')
          if [ -z "${rel_id:-}" ]; then
            echo "::error::no release found for tag ${TAG}" >&2
            exit 1
          fi
          # Delete a same-named asset before re-uploading so a workflow re-run for
          # an existing tag replaces the file instead of erroring on a duplicate.
          existing=$(curl -fsSL -H "Authorization: token ${TOKEN}" \
            "${FORGEJO_API}/releases/${rel_id}/assets" || echo '[]')
          for name in $(cd dist && ls); do
            old=$(printf '%s' "$existing" | ASSET="$name" node -e '
              const a = JSON.parse(require("fs").readFileSync(0, "utf8") || "[]");
              const m = (a || []).find(x => x.name === process.env.ASSET);
              if (m) process.stdout.write(String(m.id));
            ')
            if [ -n "$old" ]; then
              curl -fsSL -X DELETE -H "Authorization: token ${TOKEN}" \
                "${FORGEJO_API}/releases/${rel_id}/assets/${old}" || true
            fi
            curl -fsSL -X POST -H "Authorization: token ${TOKEN}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"dist/${name}" \
              "${FORGEJO_API}/releases/${rel_id}/assets?name=${name}"
            echo "uploaded ${name} to Forgejo"
          done

      - name: Publish the same assets to the GitHub mirror release
        env:
          PAT: ${{ secrets.GITHUB_MIRROR_PAT }}
        run: |
          set -euo pipefail
          # GitHub-mirror side: no PAT -> skip loudly, never fail the Forgejo
          # release. When the secret IS set (the ward#454 precondition Kai
          # provisions before dispatch) this publishes the byte-identical
          # binaries + SHA256SUMS to the GitHub release for the SAME tag, so a
          # GitHub arrival installs a checksummed binary without touching
          # forgejo.coilysiren.me (ward#454 done-condition). The release is
          # authored by the PAT user, not github-actions[bot].
          if [ -z "${PAT:-}" ]; then
            echo "::warning::GITHUB_MIRROR_PAT not set; skipping GitHub release publish (Forgejo release is unaffected)" >&2
            exit 0
          fi
          gh_api="https://api.github.com/repos/${GITHUB_REPO}"
          gh_uploads="https://uploads.github.com/repos/${GITHUB_REPO}"
          auth="Authorization: token ${PAT}"
          accept="Accept: application/vnd.github+json"

          # 1. Ensure the tag object exists on GitHub before the release points
          #    at it. The tag is immutable, so a concurrent push of the same
          #    object is a harmless no-op.
          git remote add github "https://x-access-token:${PAT}@github.com/${GITHUB_REPO}.git"
          git push github "refs/tags/${TAG}:refs/tags/${TAG}"

          # 2. Reuse the EXACT Forgejo release body so both pages read identically.
          #    node parses the JSON (the docker runner has no jq, but the checkout
          #    JS action leaves node on PATH).
          fj_rel=$(curl -fsSL "${FORGEJO_API}/releases/tags/${TAG}")
          BODY=$(printf '%s' "$fj_rel" | node -e '
            const r = JSON.parse(require("fs").readFileSync(0, "utf8"));
            process.stdout.write(r.body || "");
          ')

          # 3. Create the GitHub release, or find it if a prior run already did.
          payload=$(TAG="$TAG" BODY="$BODY" node -e '
            process.stdout.write(JSON.stringify({
              tag_name: process.env.TAG,
              name: process.env.TAG,
              body: process.env.BODY,
            }));
          ')
          code=$(curl -sS -o /tmp/gh_rel.json -w '%{http_code}' \
            -X POST -H "$auth" -H "$accept" "${gh_api}/releases" \
            --data-binary "$payload")
          if [ "$code" = "201" ]; then
            rel_id=$(node -e 'process.stdout.write(String(JSON.parse(require("fs").readFileSync("/tmp/gh_rel.json","utf8")).id))')
            echo "created GitHub release ${TAG} (id ${rel_id})"
          else
            echo "create returned HTTP ${code}; treating as existing release and looking it up" >&2
            rel_id=$(curl -fsSL -H "$auth" -H "$accept" "${gh_api}/releases/tags/${TAG}" \
              | node -e 'process.stdout.write(String(JSON.parse(require("fs").readFileSync(0,"utf8")).id || ""))')
            if [ -z "${rel_id:-}" ]; then
              echo "::error::could not create or find GitHub release for ${TAG} (create HTTP ${code})" >&2
              cat /tmp/gh_rel.json >&2 || true
              exit 1
            fi
            echo "using existing GitHub release ${TAG} (id ${rel_id})"
          fi

          # 4. Upload the identical assets. Delete a same-named asset first so a
          #    re-run replaces the file rather than 422-ing on a duplicate name.
          existing=$(curl -fsSL -H "$auth" -H "$accept" \
            "${gh_api}/releases/${rel_id}/assets?per_page=100" || echo '[]')
          for name in $(cd dist && ls); do
            old=$(printf '%s' "$existing" | ASSET="$name" node -e '
              const a = JSON.parse(require("fs").readFileSync(0, "utf8") || "[]");
              const m = (a || []).find(x => x.name === process.env.ASSET);
              if (m) process.stdout.write(String(m.id));
            ')
            if [ -n "$old" ]; then
              curl -fsSL -X DELETE -H "$auth" -H "$accept" \
                "${gh_api}/releases/assets/${old}" || true
            fi
            curl -fsSL -X POST -H "$auth" -H "Content-Type: application/octet-stream" \
              --data-binary @"dist/${name}" \
              "${gh_uploads}/releases/${rel_id}/assets?name=${name}"
            echo "uploaded ${name} to GitHub"
          done
          echo "GitHub release ${TAG} published with the full matrix + SHA256SUMS"

  publish-kdl-write:
    needs: release
    if: ${{ needs.release.outputs.tag != '' }}
    runs-on: docker
    env:
      TAG: ${{ needs.release.outputs.tag }}
      GO_VERSION: "1.26.4"
      KDL_GEN_REF: v0.72.0
      KDL_GUARDFILE: ./.ward/ward-kdl/ward-kdl-write/ward-kdl.forgejo.write.guardfile.kdl
      GOPRIVATE: forgejo.coilysiren.me
      FORGEJO_BASE_URL: https://forgejo.coilysiren.me
      PKG_OWNER: coilyco-flight-deck
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release.outputs.tag }}
          fetch-depth: 0

      - name: Install Go
        run: |
          set -euo pipefail
          curl -fsSL "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz" -o /tmp/go.tar.gz
          tar -xzf /tmp/go.tar.gz -C /usr/local
          echo "/usr/local/go/bin" >> "$GITHUB_PATH"

      - name: Build ward-kdl-write (linux amd64 + arm64)
        timeout-minutes: 15
        run: |
          set -euo pipefail
          # Generated, not a plain ./cmd build: the generator (KDL_GEN_REF, in
          # lockstep with the Makefile's REF) renders + builds the tier binary,
          # entered via the write tier's forgejo guardfile. The driver merges every
          # ward-kdl.*.guardfile.kdl in the tier subdir that shares the
          # `wrap ward-kdl-write` name (forgejo + signoz today), so the asset carries
          # the FULL write-tier surface - matching `make build-ward-kdl-tiers`. This
          # is the tier the in-container broker shells (ward#329). See docs/broker.md.
          # GOPROXY=direct so fresh cli-guard pseudo-versions resolve, matching
          # the release build's source fetches. See docs/release-binaries.md.
          export GOPROXY=direct GOSUMDB=off
          mkdir -p dist
          gen="forgejo.coilysiren.me/coilyco-flight-deck/cli-guard/cmd/kdl-specs@${KDL_GEN_REF}"
          bound() { if command -v timeout >/dev/null 2>&1; then timeout 240 "$@"; else "$@"; fi; }
          # amd64 (host): the generator renders + builds the tier binary directly.
          for attempt in 1 2 3; do
            if bound go run "$gen" build --guardfile "$KDL_GUARDFILE" \
                 --out "dist/ward-kdl-write-linux-amd64" --set-version "$TAG"; then break; fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::ward-kdl-write amd64 build failed after 3 attempts" >&2
              exit 1
            fi
            echo "ward-kdl-write build attempt ${attempt} failed/timed out; retrying in 5s" >&2
            sleep 5
          done
          # arm64: kdl-specs build is host-arch only, so cross-build from the
          # self-contained module it just materialized in the generator cache. The
          # CI cache is fresh and this is a single build (not a loop), so exactly one
          # cache dir exists - keeping this single-result `find` unambiguous.
          cachedir="$(find "$HOME/.cli-guard/cache/specverb" -mindepth 1 -maxdepth 1 -type d | head -1)"
          if [ -z "$cachedir" ] || [ ! -f "$cachedir/main.go" ]; then
            echo "::error::could not locate the generator cache module for the arm64 cross-build" >&2
            exit 1
          fi
          ( cd "$cachedir" && GOOS=linux GOARCH=arm64 go build -trimpath \
              -ldflags "-s -w -X main.Version=${TAG}" \
              -o "${GITHUB_WORKSPACE}/dist/ward-kdl-write-linux-arm64" . )
          ls -l dist

      - name: Publish ward-kdl-write to the internal package registry (not the release page)
        env:
          TOKEN: ${{ secrets.CI_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ]; then
            echo "::error::CI_RELEASE_TOKEN not set; cannot publish ward-kdl-write to the package registry" >&2
            exit 1
          fi
          # The Forgejo generic package registry is the broker's INTERNAL channel
          # (ward#501): the write tier lands here keyed to the release tag, and
          # nothing shows on the public release page. Package `ward-kdl-write`,
          # version = the release tag, one file per arch. Delete-then-PUT so a
          # workflow re-run for an existing tag replaces the file instead of 409-ing
          # on a duplicate. CI_RELEASE_TOKEN must carry package write scope.
          base="${FORGEJO_BASE_URL}/api/packages/${PKG_OWNER}/generic/ward-kdl-write/${TAG}"
          for arch in amd64 arm64; do
            file="ward-kdl-write-linux-${arch}"
            # Quiet DELETE: a fresh tag has nothing to delete (404), so swallow it.
            curl -sS -o /dev/null -X DELETE -H "Authorization: token ${TOKEN}" "${base}/${file}" || true
            # Capture the status instead of -f so a rejection produces an
            # ACTIONABLE message, not the bare `curl: (22) ... error: NNN` that
            # made ward#567 hard to diagnose. Two things bit this job:
            #  * HTTP 401 (`reqPackageAccess`) - CI_RELEASE_TOKEN authenticates
            #    for the release API but lacks package (write:package) scope for
            #    the ${PKG_OWNER} generic registry. This is operational: grant the
            #    scope on the secret (docs/release.md). The built-in Actions token
            #    is NOT a substitute - this instance denies it package access.
            #  * HTTP 500 "request Content-Type isn't multipart/form-data" - the
            #    generic uploader REQUIRES Content-Type: application/octet-stream;
            #    without it curl's --data-binary defaults to
            #    application/x-www-form-urlencoded and Forgejo 500s. The release
            #    -asset upload above already sets this header; the generic PUT must too.
            # `|| true` so a non-2xx response never trips set -e before the
            # diagnostic runs. A 401 rejection truncates its own body, so curl
            # exits non-zero (18) mid-read while still reporting %{http_code}; the
            # guard would otherwise die on the bare `curl: (18)` and hide the cause.
            code=$(curl -sS -o /tmp/kdl_put.txt -w '%{http_code}' -X PUT \
              -H "Authorization: token ${TOKEN}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"dist/${file}" "${base}/${file}" 2>/tmp/kdl_err.txt) || true
            if [ "$code" != "201" ] && [ "$code" != "200" ]; then
              if [ "$code" = "401" ] || [ "$code" = "403" ] || [ -z "$code" ] || [ "$code" = "000" ]; then
                echo "::error::ward-kdl-write PUT to the generic package registry failed (HTTP '${code}'; curl: $(cat /tmp/kdl_err.txt 2>/dev/null)). Almost always CI_RELEASE_TOKEN missing package (write:package) scope for ${PKG_OWNER} - a 401 rejection also truncates its body, surfacing as a transport error. Grant the scope in ward -> Settings -> Actions -> Secrets, then re-release. See docs/release.md." >&2
              else
                echo "::error::ward-kdl-write PUT to ${base}/${file} failed with HTTP ${code}: $(cat /tmp/kdl_put.txt 2>/dev/null)" >&2
              fi
              exit 1
            fi
            echo "published ${file} to the internal channel ${base}/${file}"
          done

  publish-kdl-read:
    needs: release
    if: ${{ needs.release.outputs.tag != '' }}
    runs-on: docker
    env:
      TAG: ${{ needs.release.outputs.tag }}
      GO_VERSION: "1.26.4"
      KDL_GEN_REF: v0.72.0
      KDL_GUARDFILE: ./.ward/ward-kdl/ward-kdl-read/ward-kdl.forgejo.read.guardfile.kdl
      GOPRIVATE: forgejo.coilysiren.me
      FORGEJO_BASE_URL: https://forgejo.coilysiren.me
      PKG_OWNER: coilyco-flight-deck
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release.outputs.tag }}
          fetch-depth: 0

      - name: Install Go
        run: |
          set -euo pipefail
          curl -fsSL "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz" -o /tmp/go.tar.gz
          tar -xzf /tmp/go.tar.gz -C /usr/local
          echo "/usr/local/go/bin" >> "$GITHUB_PATH"

      - name: Build ward-kdl-read (linux amd64 + arm64)
        timeout-minutes: 15
        run: |
          set -euo pipefail
          # The read-only observe surface for sealed director sessions (ward#572):
          # ward#547 wired install_ward_kdl_read into the entrypoint, but the binary
          # was only ever built locally by the Makefile to render guardfiles and
          # never published, so the entrypoint's best-effort fetch 404'd every run.
          # This job mirrors publish-kdl-write exactly - the same generated build,
          # entered via the read tier's forgejo guardfile. The driver merges every
          # ward-kdl.*.guardfile.kdl in the read subdir sharing the `wrap
          # ward-kdl-read` name (forgejo + signoz today), so the asset carries the
          # FULL read-tier surface - matching `make build-ward-kdl-tiers`. Read-only
          # by spec: the read guardfile has no create/edit/delete leaf (ward#240), so
          # the withheld verbs are absent at compile time, not just denied at runtime.
          # GOPROXY=direct so fresh cli-guard pseudo-versions resolve, matching
          # the release build's source fetches. See docs/release-binaries.md.
          export GOPROXY=direct GOSUMDB=off
          mkdir -p dist
          gen="forgejo.coilysiren.me/coilyco-flight-deck/cli-guard/cmd/kdl-specs@${KDL_GEN_REF}"
          bound() { if command -v timeout >/dev/null 2>&1; then timeout 240 "$@"; else "$@"; fi; }
          # amd64 (host): the generator renders + builds the tier binary directly.
          for attempt in 1 2 3; do
            if bound go run "$gen" build --guardfile "$KDL_GUARDFILE" \
                 --out "dist/ward-kdl-read-linux-amd64" --set-version "$TAG"; then break; fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::ward-kdl-read amd64 build failed after 3 attempts" >&2
              exit 1
            fi
            echo "ward-kdl-read build attempt ${attempt} failed/timed out; retrying in 5s" >&2
            sleep 5
          done
          # arm64: kdl-specs build is host-arch only, so cross-build from the
          # self-contained module it just materialized in the generator cache. The
          # CI cache is fresh and this is a single build (not a loop), so exactly one
          # cache dir exists - keeping this single-result `find` unambiguous.
          cachedir="$(find "$HOME/.cli-guard/cache/specverb" -mindepth 1 -maxdepth 1 -type d | head -1)"
          if [ -z "$cachedir" ] || [ ! -f "$cachedir/main.go" ]; then
            echo "::error::could not locate the generator cache module for the arm64 cross-build" >&2
            exit 1
          fi
          ( cd "$cachedir" && GOOS=linux GOARCH=arm64 go build -trimpath \
              -ldflags "-s -w -X main.Version=${TAG}" \
              -o "${GITHUB_WORKSPACE}/dist/ward-kdl-read-linux-arm64" . )
          ls -l dist

      - name: Publish ward-kdl-read to the internal package registry (not the release page)
        env:
          TOKEN: ${{ secrets.CI_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ]; then
            echo "::error::CI_RELEASE_TOKEN not set; cannot publish ward-kdl-read to the package registry" >&2
            exit 1
          fi
          # Same internal generic channel as publish-kdl-write (ward#501): the read
          # tier lands here keyed to the release tag, nothing on the public release
          # page. Package `ward-kdl-read`, version = the release tag, one file per
          # arch - the exact path the entrypoint's install_ward_kdl_read fetches
          # (cmd/ward/containerassets/entrypoint.sh). Delete-then-PUT so a workflow
          # re-run for an existing tag replaces the file instead of 409-ing on a
          # duplicate. CI_RELEASE_TOKEN must carry package write scope.
          base="${FORGEJO_BASE_URL}/api/packages/${PKG_OWNER}/generic/ward-kdl-read/${TAG}"
          for arch in amd64 arm64; do
            file="ward-kdl-read-linux-${arch}"
            # Quiet DELETE: a fresh tag has nothing to delete (404), so swallow it.
            curl -sS -o /dev/null -X DELETE -H "Authorization: token ${TOKEN}" "${base}/${file}" || true
            # Capture the status instead of -f so a rejection produces an ACTIONABLE
            # message, not the bare `curl: (22) ... error: NNN` that made ward#567
            # hard to diagnose. The two faults are the same as publish-kdl-write:
            #  * HTTP 401 (`reqPackageAccess`) - CI_RELEASE_TOKEN authenticates for
            #    the release API but lacks package (write:package) scope for the
            #    ${PKG_OWNER} generic registry. Operational: grant the scope on the
            #    secret (docs/release.md). The built-in Actions token is denied.
            #  * HTTP 500 "request Content-Type isn't multipart/form-data" - the
            #    generic uploader REQUIRES Content-Type: application/octet-stream;
            #    without it curl's --data-binary defaults to
            #    application/x-www-form-urlencoded and Forgejo 500s.
            # `|| true` so a non-2xx response never trips set -e before the
            # diagnostic runs; a 401 rejection truncates its own body so curl exits
            # non-zero (18) mid-read while still reporting %{http_code}.
            code=$(curl -sS -o /tmp/kdl_put.txt -w '%{http_code}' -X PUT \
              -H "Authorization: token ${TOKEN}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"dist/${file}" "${base}/${file}" 2>/tmp/kdl_err.txt) || true
            if [ "$code" != "201" ] && [ "$code" != "200" ]; then
              if [ "$code" = "401" ] || [ "$code" = "403" ] || [ -z "$code" ] || [ "$code" = "000" ]; then
                echo "::error::ward-kdl-read PUT to the generic package registry failed (HTTP '${code}'; curl: $(cat /tmp/kdl_err.txt 2>/dev/null)). Almost always CI_RELEASE_TOKEN missing package (write:package) scope for ${PKG_OWNER} - a 401 rejection also truncates its body, surfacing as a transport error. Grant the scope in ward -> Settings -> Actions -> Secrets, then re-release. See docs/release.md." >&2
              else
                echo "::error::ward-kdl-read PUT to ${base}/${file} failed with HTTP ${code}: $(cat /tmp/kdl_put.txt 2>/dev/null)" >&2
              fi
              exit 1
            fi
            echo "published ${file} to the internal channel ${base}/${file}"
          done

  bump-tap-formula:
    needs: release
    if: ${{ needs.release.outputs.tag != '' }}
    runs-on: docker
    env:
      TAG: ${{ needs.release.outputs.tag }}
      FORGEJO_BASE_URL: https://forgejo.coilysiren.me
      WARD_REPO: coilyco-flight-deck/ward
      TAP_REPO: coilyco-flight-deck/homebrew-tap
      FORMULA_PATH: Formula/ward.rb
    steps:
      - name: Bump tap formula and push
        env:
          TAP_WRITE_TOKEN: ${{ secrets.TAP_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          # Push auth is an explicit Actions secret, mirroring publish-binaries'
          # CI_RELEASE_TOKEN: one rotatable, visible credential instead of the
          # tap-writer runner's hidden git credential helper, which broke silently
          # and froze the tap at v0.96.0 (ward#237, ward#243). Guard up front so a
          # missing secret fails loudly here rather than at the push.
          if [ -z "${TAP_WRITE_TOKEN:-}" ]; then
            echo "::error::TAP_WRITE_TOKEN not set; cannot push tap formula" >&2
            exit 1
          fi
          version="${TAG#v}"
          artifact_root="$FORGEJO_BASE_URL/${WARD_REPO}/releases/download/${TAG}"
          hash_asset() {
            asset="$1"
            if command -v sha256sum >/dev/null 2>&1; then
              curl -fsSL "${artifact_root}/${asset}" | sha256sum | awk '{print $1}'
            else
              curl -fsSL "${artifact_root}/${asset}" | shasum -a 256 | awk '{print $1}'
            fi
          }
          darwin_amd64=$(hash_asset ward-darwin-amd64)
          darwin_arm64=$(hash_asset ward-darwin-arm64)
          linux_amd64=$(hash_asset ward-linux-amd64)
          linux_arm64=$(hash_asset ward-linux-arm64)
          for sha in "$darwin_amd64" "$darwin_arm64" "$linux_amd64" "$linux_arm64"; do
            if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{64}$'; then
              echo "::error::computed sha256 '${sha}' for ${artifact_root} is not a 64-hex digest; refusing to write formula" >&2
              exit 1
            fi
          done

          # Clone the tap's live main and rewrite the formula in place. The
          # release-asset pins are the source of truth.
          git clone --depth 1 "$FORGEJO_BASE_URL/$TAP_REPO.git" tap
          cd tap
          cat > "$FORMULA_PATH" <<EOF
          class Ward < Formula
            desc "A contributor-facing cli-guard consumer"
            homepage "https://forgejo.coilysiren.me/coilyco-flight-deck/ward"
            version "${version}"
            license "MIT"

            on_macos do
              if Hardware::CPU.arm?
                url "${artifact_root}/ward-darwin-arm64"
                sha256 "${darwin_arm64}"
              else
                url "${artifact_root}/ward-darwin-amd64"
                sha256 "${darwin_amd64}"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "${artifact_root}/ward-linux-arm64"
                sha256 "${linux_arm64}"
              else
                url "${artifact_root}/ward-linux-amd64"
                sha256 "${linux_amd64}"
              end
            end

            def install
              asset =
                if OS.mac?
                  Hardware::CPU.arm? ? "ward-darwin-arm64" : "ward-darwin-amd64"
                else
                  Hardware::CPU.arm? ? "ward-linux-arm64" : "ward-linux-amd64"
                end

              chmod 0555, asset
              bin.install asset => "ward"

              bin.install_symlink "ward" => "warded"

            end

            test do
              assert_match "v#{version}", shell_output("#{bin}/ward version")
              # The warded multicall shim must be on PATH and point at the ward binary.
              assert_predicate bin/"warded", :symlink?
              assert_equal (bin/"ward").realpath, (bin/"warded").realpath
            end
          end
EOF

          if git diff --quiet -- "$FORMULA_PATH"; then
            echo "formula already at ${TAG}, nothing to push"
            exit 0
          fi
          git config user.name "forgejo-tap-writer"
          git config user.email "coilyco-ops@coilysiren.me"
          git commit -aqm "chore(formula): bump ward to ${TAG} [skip ci]"
          push_url="https://coilysiren:${TAP_WRITE_TOKEN}@forgejo.coilysiren.me/${TAP_REPO}.git"
          if ! git push "$push_url" HEAD:main; then
            echo "::error::push of ${FORMULA_PATH} to ${TAP_REPO} failed; TAP_WRITE_TOKEN is likely missing, rotated, or lacks push scope (see docs/release.md)" >&2
            exit 1
          fi

          published=$(curl -fsSL "$FORGEJO_BASE_URL/$TAP_REPO/raw/branch/main/$FORMULA_PATH" || true)
          if ! printf '%s' "$published" | grep -q "version \"${version}\""; then
            echo "::error::tap ${TAP_REPO} main does not serve ${TAG} after push; formula bump did not land" >&2
            exit 1
          fi
          if ! printf '%s' "$published" | grep -q "/releases/download/${TAG}/ward-darwin-amd64"; then
            echo "::error::tap ${TAP_REPO} main does not serve the release-asset URL for ${TAG} after push" >&2
            exit 1
          fi
          echo "tap ${TAP_REPO} formula bumped to ${TAG}"

  bump-scoop-manifest:
    needs: [release, publish-binaries]
    if: ${{ needs.release.outputs.tag != '' }}
    runs-on: docker
    env:
      TAG: ${{ needs.release.outputs.tag }}
      FORGEJO_BASE_URL: https://forgejo.coilysiren.me
      WARD_REPO: coilyco-flight-deck/ward
      BUCKET_REPO: coilyco-flight-deck/scoop-bucket
      MANIFEST_PATH: bucket/ward.json
    steps:
      - name: Write ward.json to the scoop bucket and push
        env:
          SCOOP_WRITE_TOKEN: ${{ secrets.SCOOP_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          # Windows sibling of bump-tap-formula: push the scoop manifest at release
          # time instead of leaving the bucket to a daily autoupdate poll (ward#571).
          # scoop's ward.json used to refresh only on a bucket-side cron, so it lagged
          # however many releases landed between runs (minor bump every push to main);
          # writing it from the tag build is the push-not-poll fix the tap already has.
          # The bucket is Forgejo-canonical (users add it from forgejo.coilysiren.me,
          # checkver reads the Forgejo releases.atom), so the manifest is written where
          # scoop reads it, not the GitHub mirror. See docs/release.md.
          # Push auth is an explicit Actions secret, mirroring bump-tap-formula's
          # TAP_WRITE_TOKEN: one rotatable, visible credential. Guard up front so a
          # missing secret fails loudly HERE (a red bump job on an otherwise green
          # release) rather than letting the manifest silently freeze - the exact
          # silent-lag failure this issue fixes, and the ward#237 tap lesson. The
          # release itself is already published by the jobs above; only this bump
          # goes red, so Kai provisions the secret once and re-releases.
          if [ -z "${SCOOP_WRITE_TOKEN:-}" ]; then
            echo "::error::SCOOP_WRITE_TOKEN not set; cannot push scoop manifest. Set it in ward -> Settings -> Actions -> Secrets (scope: push to ${BUCKET_REPO}). See docs/release.md." >&2
            exit 1
          fi
          VER="${TAG#v}"
          # Read the two windows hashes from the .sha256 sidecars publish-binaries
          # uploaded (bare digest per asset, the scoop autoupdate contract, ward#561).
          # pipefail matters: a failed sidecar fetch must abort, not hash an empty body.
          dl="$FORGEJO_BASE_URL/${WARD_REPO}/releases/download/${TAG}"
          amd64_hash=$(curl -fsSL "${dl}/ward-windows-amd64.exe.sha256" | tr -d '[:space:]')
          arm64_hash=$(curl -fsSL "${dl}/ward-windows-arm64.exe.sha256" | tr -d '[:space:]')
          for h in "$amd64_hash" "$arm64_hash"; do
            if ! printf '%s' "$h" | grep -Eq '^[0-9a-f]{64}$'; then
              echo "::error::sidecar digest '${h}' is not a 64-hex sha256; refusing to write manifest" >&2
              exit 1
            fi
          done

          # Clone the bucket's live main and rewrite the whole manifest. Writing the
          # FULL file (not an in-place version patch) is deliberate: it is self-healing
          # - the first release creates ward.json even though the bucket has none yet,
          # and ward stays the single source of truth for its own manifest. The
          # checkver/autoupdate blocks are kept so a bucket-side poll still works as a
          # safety net if a push is ever missed.
          git clone --depth 1 "$FORGEJO_BASE_URL/$BUCKET_REPO.git" bucket
          cd bucket
          mkdir -p "$(dirname "$MANIFEST_PATH")"
          # Generate with node (present on the docker runner, used elsewhere in this
          # pipeline) so the JSON is always well-formed - no hand-quoting of hashes.
          VER="$VER" AMD64_HASH="$amd64_hash" ARM64_HASH="$arm64_hash" \
          WARD_REPO="$WARD_REPO" FORGEJO_BASE_URL="$FORGEJO_BASE_URL" \
          MANIFEST_PATH="$MANIFEST_PATH" \
          node -e '
            const b = process.env.FORGEJO_BASE_URL + "/" + process.env.WARD_REPO;
            const rel = b + "/releases/download";
            const m = {
              version: process.env.VER,
              description: "Audited verb gate + operator surface: the CLI contributors and agents route build/test/lint and operator ops through.",
              homepage: b,
              license: "MIT",
              architecture: {
                "64bit": {
                  url: rel + "/v" + process.env.VER + "/ward-windows-amd64.exe#/ward.exe",
                  hash: process.env.AMD64_HASH,
                },
                arm64: {
                  url: rel + "/v" + process.env.VER + "/ward-windows-arm64.exe#/ward.exe",
                  hash: process.env.ARM64_HASH,
                },
              },
              bin: "ward.exe",
              checkver: { url: b + "/releases.atom", regex: "releases/tag/v([\\d.]+)" },
              autoupdate: {
                architecture: {
                  "64bit": { url: rel + "/v$version/ward-windows-amd64.exe#/ward.exe", hash: { url: "$url.sha256" } },
                  arm64: { url: rel + "/v$version/ward-windows-arm64.exe#/ward.exe", hash: { url: "$url.sha256" } },
                },
              },
            };
            require("fs").writeFileSync(process.env.MANIFEST_PATH, JSON.stringify(m, null, 4) + "\n");
          '

          # Stage and compare against HEAD. `git add` + `diff --cached` detects both
          # a version change and a brand-new (untracked) ward.json, so a re-run of the
          # same tag stays idempotent (empty diff -> skip) while the first release,
          # which creates the file, is correctly seen as a change.
          git add "$MANIFEST_PATH"
          if git diff --cached --quiet -- "$MANIFEST_PATH"; then
            echo "manifest already at ${TAG}, nothing to push"
            exit 0
          fi
          # Attribute to the coilyco-ops bot via its Forgejo-registered email, the
          # same identity bump-tap-formula uses (ward#245, docs/agent-attribution.md).
          git config user.name "forgejo-scoop-writer"
          git config user.email "coilyco-ops@coilysiren.me"
          git commit -qm "chore(ward): bump scoop manifest to ${TAG} [skip ci]"
          # Push auth in the URL; never echoed (no set -x, git masks URL credentials).
          # A non-zero push (missing/rotated/under-scoped token) fails the job loudly
          # rather than stalling the manifest behind a green release.
          push_url="https://coilysiren:${SCOOP_WRITE_TOKEN}@forgejo.coilysiren.me/${BUCKET_REPO}.git"
          if ! git push "$push_url" HEAD:main; then
            echo "::error::push of ${MANIFEST_PATH} to ${BUCKET_REPO} failed; SCOOP_WRITE_TOKEN is likely missing, rotated, or lacks push scope (see docs/release.md)" >&2
            exit 1
          fi

          # Read the bucket back and confirm main now serves ${VER}. Catches a push
          # that reports success but does not land, so a stale manifest can never
          # masquerade as a green release (the ward#237 acceptance, applied to scoop).
          published=$(curl -fsSL "$FORGEJO_BASE_URL/$BUCKET_REPO/raw/branch/main/$MANIFEST_PATH" || true)
          if ! printf '%s' "$published" | grep -q "\"version\": \"${VER}\""; then
            echo "::error::bucket ${BUCKET_REPO} main does not serve ${VER} after push; scoop manifest bump did not land" >&2
            exit 1
          fi
          echo "bucket ${BUCKET_REPO} scoop manifest bumped to ${TAG}"
