# Mirror pair (ward#214): .github/workflows/test.yml and .forgejo/workflows/test.yml
# are kept identical except runs-on by scripts/check_workflow_mirror.py, so canonical
# Forgejo pushes run the same checks GitHub does. The GitHub file is the source; edit
# it (or both), then run `make lint-workflows ARGS=--fix`. See docs/workflow-mirror.md.
# Security: no untrusted github.event.* reaches run blocks; all commands are static.

name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: forgejo.coilysiren.me/coilyco-flight-deck/agentic-os:latest
    steps:
      - uses: actions/checkout@v6

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: golangci-lint
        timeout-minutes: 5
        run: golangci-lint run ./...
      - name: Alert Telegram on main failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_RED_CHAT_ID: ${{ secrets.TELEGRAM_RED_CHAT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_RED_CHAT_ID:-}" ]; then
            echo "::warning::telegram alert skipped because one or more secrets are missing" >&2
            exit 0
          fi
          message=$(printf '%s\n%s\n%s' \
            "ward test workflow failed on main" \
            "repo: ${GITHUB_REPOSITORY}" \
            "run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")
          curl -fsS -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_RED_CHAT_ID}" \
            --data-urlencode "text=${message}" \
            -d disable_web_page_preview=true
