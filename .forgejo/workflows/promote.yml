# Stage 1 of the two-stage release flow (ward#1117): every main push re-runs
# the full check suite here, builds commit-scoped draft artifacts, and only
# after the draft publish succeeds fast-forwards `release` to that sha.
# release.yml then runs on the `release` push to retag, promote those draft
# assets, and bump install channels under a no-cancel concurrency queue.
# main stays the integration branch; `release` is last-known-good.
# Bursts on main collapse to the newest sha (cancel-in-progress: true - the
# promotion is idempotent and a newer gate supersedes an older one). The
# promote push uses CI_RELEASE_TOKEN (real-user PAT): some Forgejo versions do
# not enqueue workflows for job-token pushes, so a job-token push would
# silently skip the release pipeline. The checkout is a plain anonymous git
# fetch (public repo) rather than actions/checkout: the lang-go job image has
# no node runtime for node actions, and a script checkout also never stores
# the job token as an http extraheader in git config, so no Authorization
# header can override the PAT in the promote push URL - the push
# authenticates as the PAT user and stage 2 fires (ward#1117).
# The tag helper and release creation now run from local scripts so a transient
# shared-action fetch cannot block the pipeline setup.

name: promote

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: promote-main
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

jobs:
  gate-and-promote:
    runs-on: docker
    timeout-minutes: 30
    container:
      image: forgejo.coilysiren.me/coilyco-flight-deck/agentic-os:release
    steps:
      - name: checkout
        run: |
          # Script checkout: the lang-go job image carries no node runtime,
          # so the actions/checkout node action cannot exec here. Anonymous
          # fetch of the public repo, full history + tags, no credential
          # ever written to git config (the promote push builds its own
          # PAT URL).
          set -euo pipefail
          git config --global --add safe.directory "$(pwd)"
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch -q --tags origin "+refs/heads/*:refs/remotes/origin/*" "+${GITHUB_REF}:refs/ci-trigger"
          git checkout -q --detach "$GITHUB_SHA" 2>/dev/null || git checkout -q --detach refs/ci-trigger

      - name: go vet
        run: make vet

      - name: go test
        run: make test

      - name: golangci-lint
        timeout-minutes: 20
        env:
          GOLANGCI_LINT_VERSION: "2.12.2"
          TMPDIR: ${{ runner.tool_cache }}/ward-tmp
          GOTMPDIR: ${{ runner.tool_cache }}/ward-go-tmp
          GOCACHE: ${{ runner.tool_cache }}/ward-go-build
          GOMODCACHE: ${{ runner.tool_cache }}/ward-go-mod
        run: |
          # The lang-go tier ships Go but not golangci-lint (that lived in the
          # retired full tier), so install the same pinned version the full
          # image baked before running the lint gate.
          if ! command -v golangci-lint >/dev/null 2>&1; then
            arch=$(uname -m)
            case "$arch" in x86_64) arch=amd64 ;; aarch64) arch=arm64 ;; esac
            curl -fsSL "https://github.com/golangci/golangci-lint/releases/download/v${GOLANGCI_LINT_VERSION}/golangci-lint-${GOLANGCI_LINT_VERSION}-linux-${arch}.tar.gz" \
              | tar -xz -C /usr/local/bin --strip-components=1 \
                "golangci-lint-${GOLANGCI_LINT_VERSION}-linux-${arch}/golangci-lint"
          fi
          mkdir -p "$TMPDIR" "$GOTMPDIR" "$GOCACHE" "$GOMODCACHE" && make lint

      - id: tag
        env:
          TAG_PUSH_TOKEN: ${{ github.token }}
        run: bash scripts/release-tag.sh

      - name: Build and publish draft release artifacts
        env:
          DRAFT_TAG: draft-${{ github.sha }}
          TAG: ${{ steps.tag.outputs.new_tag }}
          FORGEJO_API: https://forgejo.coilysiren.me/api/v1/repos/coilyco-flight-deck/ward
          GO_VERSION: "1.26.4"
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ensure_go() {
            if command -v go >/dev/null 2>&1; then
              current=$(go version | awk '{print $3}' | sed 's/^go//')
              case "$current" in
                1.26.*)
                  echo "using preinstalled go ${current}"
                  return 0
                  ;;
              esac
            fi
            echo "installing go ${GO_VERSION} for draft release builds"
            curl -fsSL "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz" -o /tmp/go.tar.gz
            tar -xzf /tmp/go.tar.gz -C /usr/local
            echo "/usr/local/go/bin" >> "$GITHUB_PATH"
          }
          # Build once on main, then let release.yml only promote the staged
          # draft assets. This keeps the expensive matrix off the release branch
          # and turns the release push into a retag/publish step.
          if [ -z "${TAG:-}" ]; then
            echo "::error::tag-bump did not produce a release tag for the draft artifacts" >&2
            exit 1
          fi
          make sync-defaults-assets
          ensure_go

          export GOPROXY=direct GOSUMDB=off CGO_ENABLED=0
          mkdir -p dist
          bound() { if command -v timeout >/dev/null 2>&1; then timeout 180 "$@"; else "$@"; fi; }
          for attempt in 1 2 3; do
            if bound go mod download; then break; fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::go mod download failed after 3 attempts (GOPROXY=direct fetch); draft release assets not built" >&2
              exit 1
            fi
            echo "go mod download attempt ${attempt} failed/timed out; retrying in 5s" >&2
            sleep 5
          done
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              ext=""
              [ "$os" = "windows" ] && ext=".exe"
              GOOS="$os" GOARCH="$arch" go build -trimpath \
                -ldflags "-s -w -X main.Version=${TAG}" \
                -o "dist/ward-${os}-${arch}${ext}" ./cmd/ward
            done
          done
          ( cd dist && sha256sum ward-* > SHA256SUMS )
          ( cd dist && for f in ward-*; do
              sha256sum "$f" | awk '{print $1}' > "${f}.sha256"
            done )
          bash scripts/publish-draft-release.sh

      - name: Publish the ward agent image alias without Docker daemon
        env:
          SOURCE_TOKEN: ${{ github.token }}
          TARGET_USER: coilyco-ops
          TARGET_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SOURCE_TOKEN:-}" ]; then
            echo "::error::github.token not set; cannot read the source agentic-os image alias" >&2
            exit 1
          fi
          if [ -z "${TARGET_TOKEN:-}" ]; then
            echo "::error::REGISTRY_TOKEN not set; cannot publish the ward:release image alias" >&2
            exit 1
          fi
          SOURCE_IMAGE=forgejo.coilysiren.me/coilyco-flight-deck/agentic-os:release \
          TARGET_IMAGE=forgejo.coilysiren.me/coilyco-flight-deck/ward:release \
          SOURCE_TOKEN="$SOURCE_TOKEN" \
          TARGET_USER="$TARGET_USER" \
          TARGET_TOKEN="$TARGET_TOKEN" \
          bash scripts/registry-copy-tag.sh

      - name: Promote main to release (fast-forward only)
        env:
          PROMOTE_TOKEN: ${{ secrets.CI_RELEASE_TOKEN }}
          REPO: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
        run: |
          set -euo pipefail
          if [ -z "${PROMOTE_TOKEN:-}" ]; then
            echo "::error::CI_RELEASE_TOKEN not set; promotion needs a real-user PAT so the release push enqueues release.yml (SSM /forgejo/ci-release-token)." >&2
            exit 1
          fi
          # server_url resolves to the in-cluster http URL on this runner, so
          # keep its scheme instead of assuming https.
          proto="${SERVER%%://*}"
          host="${SERVER#*://}"
          # Plain push: git refuses a non-fast-forward, so a diverged release
          # branch fails loud here instead of being silently rewritten.
          git push "${proto}://oauth2:${PROMOTE_TOKEN}@${host}/${REPO}.git" HEAD:release
          echo "promoted $(git rev-parse --short HEAD) to release"

      - name: Alert Telegram on main failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_RED_CHAT_ID }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          JOB: ${{ github.job }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          API_BASE: https://api.telegram.org
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          def build_message(repo, workflow, job, ref, sha, run_url):
              return "\n".join([
                  "CI failed on main",
                  f"repo: {repo}",
                  f"workflow: {workflow}",
                  f"job: {job}",
                  f"ref: {ref}",
                  f"sha: {sha}",
                  f"run: {run_url}",
              ])

          def main():
              bot_token = os.environ["BOT_TOKEN"]
              chat_id = os.environ["CHAT_ID"]
              message = build_message(
                  os.environ["REPO"],
                  os.environ["WORKFLOW"],
                  os.environ["JOB"],
                  os.environ["REF"],
                  os.environ["SHA"],
                  os.environ["RUN_URL"],
              )
              payload = urllib.parse.urlencode(
                  {
                      "chat_id": chat_id,
                      "text": message,
                      "disable_web_page_preview": "true",
                  }
              ).encode("utf-8")
              url = f"{os.environ['API_BASE'].rstrip('/')}/bot{bot_token}/sendMessage"
              req = urllib.request.Request(url, data=payload, method="POST")
              try:
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      resp.read()
              except urllib.error.URLError as exc:
                  print(f"telegram alert failed: {exc}")
                  raise SystemExit(1)

          main()
          PY
