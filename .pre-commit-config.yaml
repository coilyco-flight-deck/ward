repos:

  # BEGIN managed by agentic-os/scripts/apply-agentic-os-hooks.py
  - repo: https://forgejo.coilysiren.me/coilyco-flight-deck/agentic-os
    rev: ea1f408660ddd12e96d70af33d0a2c8165e51fc9
    hooks:
      - id: catalog-doc-size
      - id: catalog-trifecta
      - id: documentation-layout
      - id: context-load-points
      - id: code-comments
      - id: source-doc-refs
      - id: catalog-block-present
      - id: check-skills
      - id: dead-cross-links
      - id: repo-pointer-skills
      - id: misplaced-skills
      - id: agent-compose-size
      - id: agent-compose-dedup
      - id: trufflehog
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
        args: [--assume-in-merge]
  # END managed by agentic-os/scripts/apply-agentic-os-hooks.py

  # issue-ref gate (ward#446): a terse ref like `ward#123` never autolinks in a
  # rendered Markdown file on the GitHub mirror, so every ref in a public-facing
  # doc must be a full-URL link. `language: system` so it needs only python3 on
  # PATH (pre-commit already needs it). scripts/lint_issue_refs.py --fix rewrites.
  - repo: local
    hooks:
      - id: golangci-lint
        name: golangci-lint (matches ward exec lint)
        description: Run the repo's golangci-lint gate at commit time so local pre-commit catches the same Go complexity checks as CI.
        entry: golangci-lint run --timeout=15m ./...
        language: system
        always_run: true
        pass_filenames: false
      - id: issue-refs
        name: issue refs resolve for GitHub readers (ward#446)
        entry: python3 scripts/lint_issue_refs.py
        language: system
        files: '\.md$'
        pass_filenames: true
      - id: workflow-mirror
        name: Forgejo<->GitHub Actions mirror stays in sync (ward#214)
        entry: python3 scripts/check_workflow_mirror.py
        language: system
        files: '^(\.github/workflows/|\.forgejo/workflows/|scripts/check_workflow_mirror\.py)'
        pass_filenames: false
